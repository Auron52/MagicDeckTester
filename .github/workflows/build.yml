# Windows build + fast checks. Agents run the Linux build and regression suite locally;
# CI checks the platform they cannot run in their workspace.
#
# TRIGGER: push on ANY branch (this repo works on shared branches, not PRs), path-filtered so
# the frequent docs- and decks-only commits don't queue a Windows build. Plus manual dispatch.
#
# NOTE FOR AGENTS: push CI NOTIFIES, it does not BLOCK -- required status checks only exist on
# PRs. Check the Windows result asynchronously after pushing. See CLAUDE.md.
#
# Nothing long-running belongs here: the regression suite stays a local/overnight tool. Every
# job below is seconds-to-minutes.
name: build

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'test/unit/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'build.sh'
      - 'build.ps1'
      - 'build.cmd'
      - 'play.sh'
      - 'play.ps1'
      - 'play.cmd'
      - 'tools/play/**'
      - '.github/workflows/**'
      # A job that RUNS a file must be triggered by that file changing. The viewer checks below are
      # `node test/viewer_*.js`, and the line-build check reads every saved game under references/ --
      # but neither path was listed, so both could BREAK this workflow without STARTING it.
      #
      # That is not hypothetical (2026-08-29): committing 19 hand-played references turned the
      # line-build check red, no run fired, and the failure first appeared on the next unrelated
      # src commit -- where it read as "the minotaur engine fix broke the build". The fix to the
      # check itself then also failed to trigger a run, so the branch sat on a red status for a
      # defect that was already repaired. A trigger set narrower than the job set turns a clean
      # signal into a misattributed one.
      - 'test/viewer_*.js'
      - 'test/viewer_*.py'
      - 'scripts/check_references_safe.py'
      - 'scripts/safe_worktree_remove.sh'
      - 'references/**'
  workflow_dispatch:

# An in-flight run is never cancelled: it finishes, and at most ONE run waits behind it per branch (a
# newer push replaces the waiting run, never the running one), so pushes cannot build a backlog
# (USER 2026-11-19: "let it run and then only launch a new one for subsequent pushes after it is done").
# Nobody waits on CI: start a background watch and read the result when it lands (CLAUDE.md).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows build and checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows

      - name: Build (Release)
        run: cmake --build build --config Release -j 4

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Pure-Node, no npm install: it only require()s tools/play/linebuild.js and reads the
      # committed references/. Guards the viewer's client layer, which the engine-side checks
      # are structurally blind to.
      - name: Viewer line-build check
        run: node test/viewer_linebuild_check.js

      # Reference-game safety (tools/play/refsafe.js): backup copy, plumbing-only autosave commit,
      # push + push-failure reporting, startup scan, the real /api/save-reference route, and the
      # linked-worktree refusal -- all against scratch repos. The viewer (play.cmd) saves
      # references on Windows too. Needs git + the binary built above.
      - name: Viewer reference-safety check
        run: node test/viewer_reference_backup_check.js
