  const hand=d.hand||[];
  const K=d.bottom_total||1;                    // total cards to bottom this keep (London mulligan_count)
  // Tabled deck: the exhaustive mulligan profile gives the JOINT optimal bottom set (all K at once, a
  // lookup -- not a card-at-a-time search), emitted as ai_set. Pre-select it. Table-less deck: fall back
  // to the async per-step deep hint (top pick + win-optimal safe flags).
  const tabled = Array.isArray(d.ai_set) && d.ai_set.length===K;   // only when it covers ALL K bottoms
  const aiSet = tabled ? new Set(d.ai_set) : null;
  const hint=d._aiHint;
  const ai = (!tabled && hint && hint.ai_choice) ? hint.ai_choice.index : undefined;
  const wo = (!tabled && hint && hint.win_optimal) ? hint.win_optimal : [];
  const someOpt = wo.length && wo.some(x=>x===true) && wo.some(x=>x===false);
  // Init selection once per decision so re-renders on toggle keep the picks; seed with the profile's
  // joint set when tabled. The engine reads one hand-index per bottom decision, so commitBottomBatch
  // submits the picks in DESCENDING hand-index order (identical technique to the cleanup-discard panel).
  if (S._bottomFor !== d.decision_index){ S._bottomFor=d.decision_index; S.bottomSel=new Set(tabled?d.ai_set:[]); }
  const sel=S.bottomSel;
  const hintTxt = tabled ? `Mulligan profile’s optimal set is preselected`
                : d._keepHintPending ? `<span class="hint">consulting mulligan table…</span>`
                : hint===undefined ? `<span class="hint">AI thinking…</span>`
                : (ai!=null && hand[ai]) ? `AI would start with <b>${esc(hand[ai].name)}</b> (depth ${hint.depth})`
                : `AI pick unavailable`;
  let h=`<h3>Bottom ${K} card${K===1?'':'s'} — London mulligan</h3>`;
  h+=`<div class="sub">Keeping a ${hand.length}-card hand: put <b>${K}</b> card${K===1?'':'s'} on the bottom. `+
     `Click to toggle${tabled?'; AI = the profile’s joint pick':(someOpt?'; ✓ = safe to bottom (keeps the earliest win)':'')}. ${hintTxt}.</div>`;
  h+=`<div class="tutgrid">`;
  hand.forEach((c,i)=>{
    const isSel=sel.has(i), isAI=tabled?aiSet.has(i):(i===ai), safe=someOpt&&wo[i]===true;
    h+=`<span class="cardmini tdig${isSel?' sel':''}${isAI?' def':''}" data-opt="${i}" data-name="${esc(c.name)}" title="${esc(c.name)}${safe?' — safe to bottom':''}">`+
       `<img loading="lazy" src="${scryImg(c.name,'small')}" onerror="this.style.opacity=.15"/><em>${esc(c.name)}</em>`+
       (isAI?`<span class="deftag">AI${tabled?'':' top'}</span>`:safe?`<span class="deftag" style="background:#2a7a4a">✓</span>`:``)+`</span>`;
  });
  h+=`</div>`;
  const n=sel.size, ok=(n===K);
  h+=`<div class="pbtns"><span class="pcount">${n} / ${K} selected</span>`+
     ((tabled||ai!=null||someOpt)?`<button class="ghost" id="bottomai">Follow AI</button>`:'')+`<span class="spacer"></span>`+
     `<button id="decconfirm" class="primary" ${ok?'':'disabled'}>Bottom ${K} card${K===1?'':'s'}</button></div>`;
  return h;
}
// Fetch the deck's MULLIGAN-TABLE recommendation in the background (see /api/keep-hint). Fired when a
// mulligan OR bottom modal is first shown; the server loads the exhaustive sidecar (expensive) and
// returns the table's keep/mulligan call (ai_choice) and joint bottom set (ai_set). Patched in place
// when it returns — never blocks the human (the AI pick is good-to-have, not required to choose). For a
// table-less deck the server returns hasSidecar:false and we fall back to the deep-search bottom hint.
function fetchKeepHint(d){
  d._keepHintPending = true;
  const captured = d.decision_index;
  post('/api/keep-hint', cfg({})).then(h=>{
    d._keepHintPending = false;
    if (!h || h.kind!=='keep-hint'){ d._keepHint=null; if (S.decision===d) renderBoard(); return; }
    if (!h.hasSidecar){                                   // table-less: use the deep-search bottom hint
      d._keepHint=null;
      if (d.type==='bottom' && d._aiHint===undefined && !d._aiHintPending) fetchBottomHint(d);
      else if (S.decision===d) renderBoard();
      return;
    }
    if (h.decision_index!==captured){ d._keepHint=null; if (S.decision===d) renderBoard(); return; }
    d._keepHint=h;
    if (d.type==='mulligan' && h.ai_choice!=null) d.ai_choice=h.ai_choice;   // table's keep/mulligan call
    if (d.type==='bottom' && Array.isArray(h.ai_set)){
      d.ai_set=h.ai_set;                                                     // table's joint bottom set
      // Re-seed the bottom selection with the table set IF the human hasn't touched it yet (they may
      // have started picking while the sidecar loaded -- never clobber their choices).
      if (S._bottomFor===d.decision_index && S.bottomSel && S.bottomSel.size===0) S._bottomFor=null;
    }
    if (S.decision===d) renderBoard();
  }).catch(()=>{ d._keepHintPending=false; d._keepHint=null; if (S.decision===d) renderBoard(); });
}
// Fetch the deep-search bottom hint in the background (see /api/ai-hint). Fired when a bottom decision
// is first shown; patches the modal in place when it returns. Never blocks the human — they can bottom
// any card immediately, in which case the stale hint is dropped (decision_index no longer matches).
function fetchBottomHint(d){
  d._aiHintPending = true;
  const captured = d.decision_index;
  post('/api/ai-hint', cfg({ hintDepth: 5 })).then(h=>{
    d._aiHintPending = false;
    d._aiHint = (h && h.kind==='hint' && h.type==='bottom' && h.decision_index===captured) ? h : null;
    if (S.decision===d) renderBoard();          // still on this decision -> repaint with the hint
  }).catch(()=>{ d._aiHintPending=false; d._aiHint=null; if (S.decision===d) renderBoard(); });
}

// Bottom prompt for board-click decisions: the board is the selector, this just shows the ask + Confirm.

      `<div class="pbtns"><span class="pcount">${n} / ${need} selected</span><span class="spacer"></span>`+

    return `<h3>Divide ${total} damage — ${esc(d.source||'')}</h3>`+
      `<div class="sub">Set the damage on each target on the board (type, or −/+). Any number of targets, each ≥1, summing to <b>${total}</b>.</div>`+
      `<div class="pbtns"><span class="pcount">${sum} / ${total} assigned · ${n} target${n===1?'':'s'}</span>`+
      `<span class="spacer"></span><button id="decconfirm" class="primary" ${(sum===total&&n>=1)?'':'disabled'}>Confirm</button></div>`;
  }
  if (dec==='bounce'){
    const sel=[...(S.boardSel||[])];
    const opt=sel.length?(d.options||[]).find(o=>'m:'+o.perm_index===sel[0]):null;
    return `<h3>Return a land — ${esc(d.source||'')}</h3>`+

      `<div class="pbtns"><span class="pcount">Returning: <b>${opt?esc(opt.name):'(pick a land)'}</b></span>`+

  }

      `<div class="sub">Click a land on your board to sacrifice (${esc(d.source||'this spell')}'s additional cost). Eligible lands are highlighted; ✓ marks your pick.</div>`+
      `<div class="pbtns"><span class="pcount">Sacrificing: <b>${opt?esc(opt.name):'(pick a land)'}</b></span>`+
      `<span class="spacer"></span><button id="decconfirm" class="primary" ${sel.length?'':'disabled'}>Confirm</button></div>`;
  }
  if (dec==='attach_host'){
    const sel=[...(S.boardSel||[])];
    const opt=sel.length?(d.options||[]).find(o=>'m:'+o.perm_index===sel[0]):null;
    return `<h3>Attach ${esc(d.source||'the Equipment')} — which creature?</h3>`+
      `<div class="sub">The attack trigger put this Equipment onto the battlefield; click one of your creatures to attach it to (free — no equip cost), or leave it unattached. The AI's pick (best attacker) is preselected.</div>`+
      `<div class="pbtns"><span class="pcount">Attaching to: <b>${opt?esc(opt.name):'(pick a creature)'}</b></span>`+
      `<span class="spacer"></span><button id="decnoattach" class="ghost">Leave unattached</button>`+
      `<button id="decconfirm" class="primary" ${sel.length?'':'disabled'}>Confirm</button></div>`;
  }
  const max=d.max_targets||1, n=(S.boardSel||new Set()).size;
  // Planeswalker LOYALTY ability target: d.loyalty says what happens to the chosen permanent
  // ("turned into a green 3/3 Elk with no abilities"), and d.source names the ability
  // ("Oko, Thief of Crowns +1"). The legal set is the ability's own printed restriction, so it can
  // contain lands, artifacts and the opponent's permanents -- never worded as damage, and the
  // opponent's FACE is not in it. This is the board click the player asked for ("use targeting on
  // the board if a targeted ability (like Oko's +1) is chosen", 2026-09-02).
  if (d.loyalty){
    return `<h3>Choose a target — ${esc(d.source||'')}</h3>`+
      `<div class="sub">The chosen permanent is <b>${esc(d.loyalty)}</b> · pick 1. Click one of the highlighted permanents on the board (either side of the table, tapped or not). The AI's pick is preselected.</div>`+
      `<div class="pbtns"><span class="pcount">${n} / 1 selected</span><span class="spacer"></span>`+
      `<button id="decconfirm" class="primary" ${n?'':'disabled'}>Confirm</button></div>`;
  }
  // Own-creature pump (Invigorate): d.pump carries "+P/+T" -- ask which of YOUR creatures to buff.
  if (d.pump){
    return `<h3>Which creature — ${esc(d.source||'')}</h3>`+
      `<div class="sub">Gets <b>${esc(d.pump)}</b> until end of turn · pick 1. Click one of your creatures on the board. The AI's pick (best attacker) is preselected.</div>`+
      `<div class="pbtns"><span class="pcount">${n} / 1 selected</span><span class="spacer"></span>`+
      `<button id="decconfirm" class="primary" ${n?'':'disabled'}>Confirm</button></div>`;
  }
  // Creature removal (Swords to Plowshares): d.remove describes the effect -- ask which OPPONENT
  // creature to exile (its controller gains life = its power; a Tainted Remedy flips that to loss).
  if (d.remove){
    return `<h3>Which creature to exile — ${esc(d.source||'')}</h3>`+
      `<div class="sub">The chosen opponent creature is ${esc(d.remove)} · pick 1. Click one of the opponent's creatures on the board (labelled with its power/toughness). The AI's pick (largest) is preselected.</div>`+
      `<div class="pbtns"><span class="pcount">${n} / 1 selected</span><span class="spacer"></span>`+
      `<button id="decconfirm" class="primary" ${n?'':'disabled'}>Confirm</button></div>`;
  }

  // offer creatures in the prompt; any-target burn (Lightning Bolt) does.
  const hasCreature=(d.legal_targets||[]).some(t=>t.kind==='permanent');
  const where = hasCreature ? "the opponent's life, a creature, or your own life" : "the opponent's life or your own life";
  // Soulfire Eruption (random_damage): each target takes a RANDOM exiled card's mana value, assigned
  // positionally (not steerable), not a fixed number — so don't show a per-target damage figure.
  const dmgWord = d.random_damage ? `a random exiled card's mana value each`
                : max>1 ? `${d.per_target_damage} damage each` : `${d.per_target_damage} damage`;

  // short target set). The opponent's face is a NORMAL target here (issue 5) and is deselectable.
  // min 0 = an "up to one target" trick (Gold Rush / Scale the Heights): confirming with NOTHING
  // selected is legal and submits the untargeted cast.
  const min = d.min_targets===0 ? 0 : Math.max(1, d.min_targets||1);
  const inRange = n>=min && n<=max;
  const rangeWord = min>=max ? `pick exactly ${max}` : (min<=1 ? `pick up to ${max}` : `pick ${min}–${max}`);
  const needNote = n<min ? ` — need ${min-n} more` : '';
  return `<h3>Choose targets — ${esc(d.source||'')}</h3>`+
    `<div class="sub">${dmgWord} · ${rangeWord}. Click targets on the board — ${where} (the opponent's face is a target you can deselect). The AI's pick is preselected.</div>`+
    `<div class="pbtns"><span class="pcount">${n} / ${max} selected${needNote}</span><span class="spacer"></span>`+
    `<button id="decconfirm" class="primary" ${inRange?'':'disabled'}>Confirm ${n} target${n===1?'':'s'}</button></div>`;
}
function wireDecisionPanel(d, dec){

    const cb=panel.querySelector('#decconfirm'); if (cb) cb.onclick=()=>commitDragonBatch(d);

    const ai=panel.querySelector('#sactutai'); if (ai) ai.onclick=()=>{ S.sacTutorSel=new Set(aiDragonSet(d)); renderDecisionPanel(d,'sac_tutor'); };
    const cb=panel.querySelector('#decconfirm'); if (cb) cb.onclick=()=>commitSacTutorBatch(d);

  else if (dec==='divide')

  else if (dec==='expressive_iteration')
    panel.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>commitEI(d, +b.dataset.opt));
  else if (dec==='retrace_discard')
    panel.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>commitRetraceDiscard(d, +b.dataset.opt));
  else if (dec==='replicate')
    panel.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>commitReplicate(d, +b.dataset.opt));
  else if (dec==='firebreathe')
    panel.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>commitFirebreathe(d, +b.dataset.opt));
  else if (dec==='jitte')
    panel.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>commitJitte(d, +b.dataset.opt));
  else if (dec==='storage_hold')
    panel.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>commitStorageHold(d, +b.dataset.opt));
  else if (dec==='land_entry')
    panel.querySelectorAll('button[data-le]').forEach(b=>b.onclick=()=>commitLandEntry(d, +b.dataset.le));
  else if (dec==='mulligan')
    panel.querySelectorAll('button[data-mull]').forEach(b=>b.onclick=()=>commitMulligan(d, +b.dataset.mull));
  else if (dec==='bottom'){

function pushChoice(d, oi, lab){ pushChoices(d, [oi], lab); }
// A decision's answer is one-or-more integers appended atomically; S.steps records how many each
// decision contributed so undo can pop a whole variable-length step (divide sends one int per legal
// target). Existing single-int decisions record a step of 1 -> behaviour unchanged.
function pushChoices(d, arr, lab){
  S.history.push({ turn:d.turn, label:lab });
  S.prev=S.decision; arr.forEach(x=>S.choices.push(x));
  (S.steps=S.steps||[]).push({ n:arr.length, auto:!!(d && d._autoStep) });   // auto -> undo pops with prior user step (#2)
  S.boardSel=null; S._selFor=null; S.divAlloc=null; S._divFor=null;
  renderHistory(); hideDecPanel(); step();
}
function commitLook(d, oi){
  const o=(d.options||[]).find(x=>x.index===oi)||{};
  const verb=d.type==='scry'?'Scry':d.type==='surveil'?'Surveil':'Reorder';
  const awayWord=d.away_zone==='graveyard'?'graveyard':d.away_zone==='bottom'?'bottom':'shuffle';
  const lab=o.shuffle?`${verb}: shuffle`:`${verb}: ${(o.top||[]).join(' > ')}${(o.away&&o.away.length)?'  | '+awayWord+': '+o.away.join(', '):''}`;
  pushChoice(d, oi, lab);
}
function commitVial(d, v){ pushChoice(d, v, v?'Vial: +counter':'Vial: hold'); }
function commitDig(d, oi){
  const c=(d.examined||[]).find(x=>x.index===oi);
  pushChoice(d, oi, `${d.source}: ${oi<0||!c?'take nothing':'take '+c.name}`);
}
function commitLightPaws(d, oi){
  const c=(d.pool||[]).find(x=>x.index===oi);
  pushChoice(d, oi, `${d.source}: ${oi<0||!c?'fetch nothing':'fetch '+c.name}`);
}
function commitLackey(d, oi){
  const c=(d.candidates||[]).find(x=>x.index===oi);
  pushChoice(d, oi, `${d.source||'Goblin Lackey'}: ${oi<0||!c?'decline':'put '+c.name}`);
}
function commitFreeCast(d, oi){
  const c=(d.candidates||[]).find(x=>x.index===oi);
  pushChoice(d, oi, `${d.source||'Maelstrom Archangel'}: ${oi<0||!c?'declined the free cast':'cast '+c.name+' for free'}`);
}
// Creative Technique demonstrate (CR 702.145): yes/no central modal, echo's shape. Reply 1 =

function commitBoardSel(d, dec){

    const opt=(d.options||[]).find(o=>'m:'+o.perm_index===sel[0]);
    oi=opt?opt.index:d.heuristic_default; lab=`${d.source}: return ${opt?opt.name:'land'}`;
  } else if (dec==='sacrifice'){
    const opt=(d.options||[]).find(o=>'m:'+o.perm_index===sel[0]);
    oi=opt?opt.index:d.heuristic_default; lab=`${d.source}: sacrifice ${opt?opt.name:'land'}`;

  } else if (dec==='soulfire_targets'){
    const want=sel.map(k=>+k.slice(2)).sort((a,b)=>a-b).join('|');
    const opt=(d.options||[]).find(o=>(o.perm_indices||[]).slice().sort((a,b)=>a-b).join('|')===want);
    oi=opt?opt.index:d.heuristic_default;
    const names=(d.candidates||[]).filter(c=>S.boardSel.has('m:'+c.perm_index)).map(c=>c.name);
    lab=`Soulfire: target ${names.join(', ')||'—'}`;
  } else if (d.random_damage){
    // Soulfire Eruption (issue #8): reply ONE int per legal target (1=selected), in legal_targets

    const flags=(d.legal_targets||[]).map(t=>S.boardSel&&S.boardSel.has(tgtKey(t))?1:0);
    const n=flags.reduce((a,b)=>a+b,0);
    const min=Math.max(1,d.min_targets||1), max=d.max_targets||flags.length;
    if (n<min || n>max){ flashHint(`Pick ${min===max?min:`${min}–${max}`} target${max===1?'':'s'} (you have ${n}).`); return; }
    const labels=(d.legal_targets||[]).filter(t=>S.boardSel.has(tgtKey(t))).map(t=>t.label);

    lab=`${d.source}: ${labels.join(', ')||'face'}`;

// ---- flow ------------------------------------------------------------------
// Log involuntary graveyard additions (Gamble discard, mill) to the persistent history, EXCLUDING
// cards just cast (which naturally go to the yard) so only the discard is named (#1). Only diff at
// main-phase boundaries vs the last logged graveyard, so sub-decisions don't double-count.
function logGyAdds(me) {
  if (!me || !me.graveyard) return;
  const cur={}; me.graveyard.forEach(n=>cur[n]=(cur[n]||0)+1);
  if (S.skipGyLog) { S.skipGyLog=false; S.lastGy=cur; S.lastCasts=new Set(); return; }  // seed after undo, no log
  const prev=S.lastGy||{}, cast=S.lastCasts||new Set(), adds=[];
  for (const n in cur) { let d=cur[n]-(prev[n]||0); if (cast.has(n)) d=0; for (let i=0;i<d;i++) adds.push(n); }
  if (adds.length) S.history.push({ turn:(S.decision&&S.decision.turn)||'', label:'⤓ to graveyard: '+adds.join(', ') });
  S.lastGy=cur; S.lastCasts=new Set();
}
// Log the cards drawn since the previous main-phase decision (turn draw + any cantrip draws of
// this segment), each on the turn the engine reported it was drawn on. dec.drew is incremental
// (the engine clears its buffer on every resolved decision), so this never double-counts. Draws
// of the same reported turn collapse into one "＋ drew: a, b" entry.
function logDraws(dec) {
  if (!dec || !dec.drew || !dec.drew.length) return;
  let i=0;
  while (i<dec.drew.length) {
    const t=dec.drew[i].turn, names=[];
    while (i<dec.drew.length && dec.drew[i].turn===t) { names.push(dec.drew[i].card); i++; }
    S.history.push({ turn:t, label:'＋ drew: '+names.join(', ') });
  }
}
// Life-affecting events (combat / damage / lifegain-loss) since the last decision -> history lines,
// coalescing runs of identical events into "×N" so a repeated drip doesn't flood the panel. `kind`
// colours the line. Shared by advanceTo (mid-game) and showResult (the winning turn's events).
function logEventList(events) {
  if (!events || !events.length) return;
  let i=0;
  while (i<events.length) {
    const e=events[i]; let n=1;
    while (i+n<events.length && events[i+n].text===e.text && events[i+n].kind===e.kind) n++;
    S.history.push({ turn:e.turn, label: e.text + (n>1?` ×${n}`:''), cls:'ev-'+e.kind });
    i+=n;
  }
}
// Reveals since the last decision -> history lines. The engine funnels EVERY reveal through one
// chokepoint (GameLogger::LogReveal), so this single renderer covers a Muxus put-split, a Treasure
// Hunt reveal-until-nonland, a tutor's searched-up card and a scry look alike. The rule: a player
// must never have to guess what was revealed or what we did with it -- which matters most for the
// choice-free effects (Muxus), since those surface no picker to infer it from.
function logReveals(dec) {
  if (!dec || !dec.reveals || !dec.reveals.length) return;
  dec.reveals.forEach(r=>{
    const cards=(r.cards||[]).map(c=>c.disposition?`${c.name} — ${c.disposition}`:c.name).join(', ');
    S.history.push({ turn:r.turn, label:`\u{1F441} ${r.source}: ${cards}` });
  });
}
function logEvents(dec) { if (dec) logEventList(dec.events); }

// History label for a land-entry answer (v: 1 = untapped/pay, 0 = tapped).
function landEntryLabel(d, v){
  const pay=d.pay_life||0;

  return `${d.source}: ${pay>0?('pay '+pay+' — untapped'):'reveal — untapped'}`;

// Auto-resolve a decision the user has toggled to "let AI decide": reply the single heuristic-default
// int without surfacing the modal. Returns true if it handled (and re-stepped) the decision. Behaves
// exactly like the user instantly clicking the AI default, so the checkpoint/steps stay 1:1.
function autoResolveDecision(dec){
  if (!dec) return false;
  // A ONE-option attach-host dialog is not a choice (USER 2026-08-27, kitty s31 T5: "That
  // shouldn't exist") -- auto-take the AI's pick silently, whatever the surfacing toggles say.
  // The answer still rides the positional --choices stream, so replays of recorded games (which
  // answered the old dialog) stay cursor-aligned. Two+ hosts keep the real choice.
  if (dec.type==='attach_host' && (dec.options||[]).length<=1){
    const def=(dec.heuristic_default==null?-1:dec.heuristic_default);
    const o=(dec.options||[])[0];
    dec._autoStep = true;
    pushChoice(dec, def, `${dec.source||'Equipment'}: attach${o?' → '+o.name:' (none)'} · auto`);
    return true;
  }
  if (!(dec.type in AUTO_RESOLVABLE)) return false;
  if (surfaceEnabled(dec.type)) return false;
  const def = (dec.heuristic_default==null ? 0 : dec.heuristic_default);
  // Firebreathe rides the turn-keyed side-channel, not --choices, so it auto-resolves via its own
  // committer (a zero-int step) rather than pushChoice. "Let AI decide" => spend the greedy max.
  if (dec.type==='firebreathe') { dec._autoStep = true; commitFirebreathe(dec, def); return true; }
  // Jitte rides the turn-keyed side-channel too. "Let AI decide" => greedy spend-all.
  if (dec.type==='jitte') { dec._autoStep = true; commitJitte(dec, def); return true; }
  // Storage tap-vs-charge rides the (turn,land_idx) side-channel too. "Let AI decide" => the heuristic
  // default (0 = allow the normal tap/burst), committed via its zero-int step.
  if (dec.type==='storage_hold') { dec._autoStep = true; commitStorageHold(dec, def); return true; }
  const lab = dec.type==='land_entry' ? landEntryLabel(dec, def)+' · auto'
            : dec.type==='replicate'  ? `${dec.source}: replicate ×${def} · auto`
            : dec.type==='retrace_discard' ? (()=>{ const c=(dec.options||[]).find(x=>x.index===def); return `${dec.source} (retrace): discard ${c?c.name:'land'} · auto`; })()
            : dec.type==='vial_charge' ? `Vial: ${def?'+counter':'hold'} · auto`
            : `${dec.source||dec.type}: auto`;
  dec._autoStep = true;        // committed WITHOUT a user rest -> undo rolls it back with the prior user step (#2)
  pushChoice(dec, def, lab);   // appends the choice, records history, hides the panel, re-steps

function advanceTo(dec) { (dec&&dec.mdfc_backs||[]).forEach(n=>MDFC_BACKS.add(n));

  S.actPick=null;   // a half-open activation picker belongs to the decision it was opened on
  // When this decision was reached by an UNDO (user stepping back), suppress the forward-play
  // auto-advance below for THIS one decision: the dead-opponent auto-pass / commit-turn skip exist to
  // spare a FORWARD player clicking through a decided game, but on undo they would instantly re-commit
  // back to the win -- so you could never land INSIDE the winning turn to inspect the board (e.g. "where
  // did Lathliss go"). Consume the flag so normal forward interaction resumes on the next decision.
  const undoing = S.undoing; S.undoing = false;
  // Undo checkpoint: snapshot the history length + graveyard/hand diff state BEFORE this decision's
  // draws/gy are logged. A single forward step appends a VARIABLE number of history lines (draw
  // lines + gy lines + the action), so undo can't just pop one -- it truncates back to this
  // checkpoint and step() replays + re-logs the decision exactly. One checkpoint per shown decision.
  (S.checkpoints=S.checkpoints||[]).push({ histLen:S.history.length, lastGy:Object.assign({},S.lastGy||{}),

  if (dec && dec.type==='main_phase') {

    // together with this turn's draws -- so pushing source-by-source printed "T4 ＋ drew: Mountain"
    // ABOVE "T3 ⚔ attacked", which reads as the attack happening after the next turn's draw. Order

    // source keeps its own sequence.
    const mark = S.history.length;
    logDraws(dec); logReveals(dec); logEvents(dec); logGyAdds(dec.me);
    if (S.history.length - mark > 1) {

  // still offers another main-phase decision (a post-combat Main 2, or a post-lethal draw-breakpoint
  // re-prompt in the SAME main -- e.g. Anti-Lifegain seed 1 game 0, which re-prompts a pre_main at

  // Next segment of a multi-land line (see commitLine): the land just resolved, the engine re-prompted

  // Only decided on a MAIN-phase frame: a land's own ETB decision (a Karoo bounce) sits in between and
  // must not cancel the chain.
  if (!undoing && (S.segmentsLeft||0) > 0 && dec && dec.type==='main_phase') {
    if (S.plan.length) { dec._autoStep=true; commitLine(); return; }

  // Main 2, or a draw-breakpoint re-prompt) so the user jumps to the next turn without clicking
  // through the rest of this one. Stops as soon as the turn advances, a non-main decision appears
  // (needs a real choice), or the game ends (result -> showResult clears the flag). Capped defensively.
  if (!undoing && S.commitTurn != null) {
    if (dec && dec.type==='main_phase' && dec.turn===S.commitTurn && (S.commitTurnPasses||0) < 40) {
      S.commitTurnPasses = (S.commitTurnPasses||0) + 1; dec._autoStep=true; S.plan=[]; commitLine(); return;
    }

// A main-phase decision offered when the opponent is already dead (<=0 life) -- the game is over,

function commitTurn(){ if (S.busy) return; S.commitTurn = S.decision && S.decision.turn; S.commitTurnPasses = 0; commitLine(); }

  $('undo').disabled = !(S.steps && S.steps.length);

async function step() {
  if (S.busy) return; S.busy=true;
  const res=await post('/api/step', cfg());
  S.busy=false; $('undo').disabled = S.choices.length===0;
  if (res.kind==='decision') {
    advanceTo(res.decision);
    // SERVER-TRUTH RESOLUTION: the engine reports which committed casts it could not pay (dropped, left
    // in hand) as decision.dropped_casts -- authoritative, replacing the old detectDropped board-diff
    // heuristic that false-positived on working lines (a self-sacrificing/redrawn cast read as dropped;
    // viewer issue #3a). It naturally DEFERS past mid-plan sub-decisions with no snapshot bookkeeping: a
    // cast that drops never resolves, so it never triggers a sub-decision (Light-Paws / dig / target),
    // and only a main-phase decision/result carries the field -- so a sub-decision reply never sees a
    // premature drop. The stateless replay records the drop in the final segment after the last consumed
    // choice, so it surfaces at the next main-phase decision.
    const dropped=(res.decision||{}).dropped_casts||[];
    if (dropped.length) return rollbackLine(dropped);
  } else if (res.kind==='result') {
    const dropped=(res.result||{}).dropped_casts||[];
    if (dropped.length) return rollbackLine(dropped);
    showResult(res.result);
  } else showError(res.error||'unknown error', res.raw);
}
// (detectDropped removed: dropped-cast detection is now server-truth via decision.dropped_casts,
// read directly in step(). The old board-diff inference false-positived on working lines — issue #3a.)
function notifyDropped(names){
  const ve=$('verdict'); ve.className='unsupported';
  ve.innerHTML=`<span class="vtag">line rejected</span>`+
    `<h4>${names.map(esc).join(', ')} — not enough mana</h4>`+
    `<div>The board couldn’t actually produce the mana this line needs, so `+
    `${names.length>1?'these spells were':'this spell was'} unpayable. The whole line was <b>rolled back</b> — `+
    `nothing was cast, tapped, or drawn. Pick a line the board can really pay for.</div>`+
    `<div class="actions"><button id="dropok" class="ghost">Dismiss</button></div>`;
  ve.style.display='block';
  $('dropok').onclick=hideVerdict;
}
async function newGame() {

// Pop the last-committed decision's state: drop its choices, roll history + gy/hand diff state back
// to the checkpoint captured when we first advanced to the decision we're returning to (index = the
// now-reduced DECISION count, not the int count -- divide is one decision but several ints). Shared
// by undo() (user-initiated) and rollbackLine() (auto-reject of an unpayable line). Returns false if
// there was nothing to pop. Callers then step() to replay + re-log the returned decision exactly.
function rollbackStep() {
  if (!(S.steps&&S.steps.length)) return false;
  // Pop the last USER action AND any auto-advanced steps that trailed it. A single user click ("Commit
  // turn", or a lethal line that leaves the dead opponent still being prompted, or an auto-resolved
  // land-entry) can commit SEVERAL engine decisions with no user rest between them; popping only the
  // last one lands mid-auto-sequence and re-logs a phantom pass line (issue #2). So keep popping while
  // the step we just removed was auto-committed, stopping once we've removed the user step above it.
  let n=0, wasAuto;
  do {
    const st=S.steps.pop(); n += (st&&st.n)||0; wasAuto = !!(st&&st.auto);
    // A firebreathe step consumed no --choices int; it recorded a turn-keyed side-channel entry -> drop
    // it so the re-step re-emits the firebreathe decision (rather than replaying the popped amount).
    if (st && st.fb != null && S.firebreathe) { delete S.firebreathe[st.fb]; }
    if (st && st.jt != null && S.jitte)       { delete S.jitte[st.jt]; }
    // #6: a storage_hold step likewise consumed no --choices int -> drop its (turn,land_idx) side-channel entry.
    if (st && st.sh != null && S.storageHold) { delete S.storageHold[st.sh]; }
    // #10: a main-phase step that PINNED a cast order -> drop its main-ordinal cast-order side-channel entry
    // (the --choices plan int itself is dropped via `n` above).
    if (st && st.co != null && S.castOrder) { delete S.castOrder[st.co]; }
  } while (wasAuto && S.steps.length);
  S.choices.length=Math.max(0,S.choices.length-n);
  S.history=S.history.filter(h=>!h.win);
  const cp=(S.checkpoints||[])[S.steps.length];
  if (cp) { S.history.length=Math.min(S.history.length,cp.histLen);
            S.lastGy=Object.assign({},cp.lastGy); S.lastCasts=new Set(cp.lastCasts);
            S.handOrder=cp.handOrder?cp.handOrder.slice():undefined; }
  else    { S.lastGy={}; S.lastCasts=new Set(); S.handOrder=undefined; }

  S.plan=[]; S.prev=null; S.over=false; S.result=null; S.leMode=false; S.vialMode=null;
  S.boardSel=null; S._selFor=null; S.divAlloc=null; S._divFor=null; hideDecPanel();

async function undo() {

// Auto-reject: the committed line dropped a cast it couldn't pay for (engine decision.dropped_casts).
// Roll the whole line back to the previous phase — as if it was never committed (nothing cast/tapped/

// makes the rollback exact: reducing S.choices and re-stepping reconstructs the pre-commit board.
async function rollbackLine(names) {
  // A rolled-back line voids any pending "Commit turn" skip (mirror handleVerdict's reject branch):
  // otherwise the post-rollback advanceTo re-fires the commit-turn auto-pass and BURNS the turn --

  S.commitTurn = null; S.commitTurnPasses = 0;
  rollbackStep();
  S.undoing = true;                // land ON the restored pre-commit decision, don't auto-advance it (mirror undo())
  renderHistory(); await step();   // re-fetch the pre-commit decision (board fully restored)

// Top-bar badge: does this (deck, seed, game#) already have a saved reference game? Informational

// Deck maturity, keyed by the deck FILE (the <option> value) -- see deckMaturity in server.js.
const DECK_META={};
// Three maturity tiers (see tierFrom in server.js): "(alpha)" is missing a piece of its apparatus,
// "(beta)" has one but has not proven it -- fewer than 30 references, or the search does not match
// the human win turn on the ones it has -- and the top tier carries no suffix at all.
//
// The suffix is deliberately in the <option> text rather than only a tooltip, so the caveat is
// visible while CHOOSING a deck: <option title> is unreliable across browsers and invisible once the
// menu closes. The badge below carries the reasons for whichever deck is selected.
const TIER_TAG={ unplayable:' (no profile)', alpha:' (alpha)', beta:' (beta)', stable:'' };
function betaTag(d){ return TIER_TAG[d.tier] !== undefined ? TIER_TAG[d.tier] : ''; }
function showBetaNote(){
  const el=$('betanote'); if(!el) return;
  const d=DECK_META[$('deck').value];
  const reasons=(d && d.tierReasons) || [];
  if(!d || (d.tier!=='alpha' && d.tier!=='beta') || !reasons.length){
    el.style.display='none'; el.textContent=''; el.title=''; el.classList.remove('alpha'); return;
  }
  el.style.display='';
  el.classList.toggle('alpha', d.tier==='alpha');
  // Chip = tier word + reference progress toward the NEXT count requirement ("beta 20/30"),
  // shown WHENEVER the count is unmet -- not only when it is a tier reason (USER 2026-08-27: the
  // progress number was the only useful part of the old inlined reasons string; "always put it
  // unless we have more references than the requirement"). refGoal is server-owned (null once
  // past the last requirement); a fixed-width fraction cannot push the reference-saved badge the
  // way the full string did. Everything else stays in the hover tooltip below.
  el.textContent=d.tier+(d.refGoal?' '+(d.refs||0)+'/'+d.refGoal:'');
  el.title=(d.tier==='alpha'
      ? 'This deck is playable but part of its apparatus is MISSING, so its numbers may be wrong:'
      : 'This deck is complete but not yet proven, so its numbers are not fully established:')
    +'\n  · '+reasons.join('\n  · ');
}
async function loadDecks() {
  const j=await (await fetch('/api/decks')).json();
  j.decks.forEach(d=>{ DECK_META[d.id||d.deck]=d; });

  // decks/<Deck>/<Version>/<Deck>.cod and so shares its parent's filename. Keying the option (and
  // DECK_META) by filename collapsed all of a deck's lists onto one entry, and selecting the
  // archived one silently played the shipping list.
  $('deck').innerHTML=j.decks.map(d=>`<option value="${esc(d.id||d.deck)}"${d.hasProfile?'':' disabled'}>${esc(d.label||d.name)}${betaTag(d)}</option>`).join('');

// drag from hand onto YOUR FIELD (#playfield) — the area where cards get played — queues the card
(function(){
  const pf=()=>$('playfield');
  // The creature thumb (data-num) under the cursor, IF the dragged Aura can legally enchant it.
  const enchTargetUnder=e=>{ const t=e.target.closest('#playfield .thumb[data-num]');
    if(!t || !S._dragTargets) return null; const num=+t.dataset.num; return (num in S._dragTargets) ? t : null; };
  document.addEventListener('dragover', e=>{ if(!e.target.closest('#playfield')) return; e.preventDefault();
    pf()&&pf().classList.add('drop-hi');
    // Highlight the specific creature when dropping here would enchant it (drag an Aura from hand).
    clearEnchDropHi(); const ct=enchTargetUnder(e); if(ct) ct.classList.add('enchdrop'); });
  document.addEventListener('dragleave', e=>{ if(e.target.closest('#playfield') && !(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#playfield'))){ pf()&&pf().classList.remove('drop-hi'); clearEnchDropHi(); } });
  document.addEventListener('drop', e=>{ if(!e.target.closest('#playfield')) return; e.preventDefault();
    pf()&&pf().classList.remove('drop-hi'); clearEnchDropHi();
    const ct=e.target.closest('#playfield .thumb[data-num]');
    // A PLANNED aura/equip (dragged from its plan chip / board overlap) carries text/planidx ->
    // re-aim it in place. Must be checked before the other paths so it never queues a duplicate.
    const pi=e.dataTransfer.getData('text/planidx');
    if(pi!==''){ if(ct) retargetPlanAura(+pi, +ct.dataset.num); return; }
    // A battlefield EQUIPMENT dragged onto a creature -> queue the Equip with that host. Dropped on
    // empty field it is a miss, not a play: an Equipment already IS on the battlefield, so there is
    // nothing sensible to queue without a host.
    const eq=e.dataTransfer.getData('text/equip');
    if(eq!==''){ if(ct) tryEquipDrop(eq, +ct.dataset.num, +(e.dataTransfer.getData('text/equipnum')||0));
                 else flashHint(`Drop ${eq} ON one of your creatures to equip it.`); return; }
    const card=e.dataTransfer.getData('text/card'); if(!card) return;
    const kind=e.dataTransfer.getData('text/kind')||'permanent';
    // Dropped ON a legal creature -> enchant it, or (an Equipment in hand) CAST it and equip that
    // creature with it in the same line -- "playing it plus equipping" as one gesture. Otherwise
    // queue the card as a plain play.
    if(ct && tryEnchantDrop(card, kind, +ct.dataset.num)) return;
    if(ct && tryEquipFromHandDrop(card, kind, +ct.dataset.num)) return;
    queueCard(card, kind); });
})();

// Scryfall hover popover
const pop=document.createElement('div'); pop.id='pop'; pop.innerHTML='<img alt=""/>'; document.body.appendChild(pop);
const popImg=pop.querySelector('img'); let popName=null;
function placePop(e){ const w=252,h=352; let x=e.clientX+18,y=e.clientY+18;
  if(x+w>innerWidth)x=e.clientX-w-18; if(y+h>innerHeight)y=Math.max(8,innerHeight-h-8); pop.style.left=x+'px'; pop.style.top=y+'px'; }
document.addEventListener('mouseover',e=>{ const c=e.target.closest('[data-name]'); if(!c)return; const n=c.getAttribute('data-name'); if(!n)return;
  if(n!==popName){ popName=n; popImg.src=scryImg(n,'normal'); } pop.style.display='block'; placePop(e); });
document.addEventListener('mousemove',e=>{ if(pop.style.display==='block') placePop(e); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('[data-name]')){ pop.style.display='none'; popName=null; } });

loadDecks();
</script>
</body>
</html>
