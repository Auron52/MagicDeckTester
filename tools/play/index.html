<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MagicDeckTester — Play</title>
<style>
  :root { --bg:#1a1c20; --panel:#24272d; --ink:#e8e8ea; --muted:#9aa0a8; --acc:#5aa9e6;
          --good:#5ad17a; --bad:#e6695a; --warn:#d6b84c; --land:#caa46a; --spell:#7fb3ff; --line:#33373e; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; color:var(--acc); }
  header label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:4px; }
  header input, header select { background:#2e323a; color:var(--ink); border:1px solid var(--line);
           border-radius:5px; padding:4px 7px; font-size:13px; }
  header input[type=number]{ width:70px; }
  button { background:#2e323a; color:var(--ink); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; font-size:13px; cursor:pointer; }
  button:hover:not(:disabled){ border-color:var(--acc); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--acc); color:#0c1116; border-color:var(--acc); font-weight:600; }
  button.ghost { background:transparent; }

  main { display:grid; grid-template-columns:1fr 340px; height:calc(100vh - 51px); }
  #board { padding:14px 20px 40px; overflow:auto; }
  #side  { background:var(--panel); border-left:1px solid var(--line); padding:14px 16px; overflow:auto; }

  /* keep the turn + phase pinned to the top of the scrolling board so it's always visible */
  #turnbar { display:flex; align-items:center; gap:12px; margin:0; position:sticky; top:0; z-index:14;
      background:var(--bg); padding:8px 0 8px; box-shadow:0 6px 8px -6px var(--bg); }
  .flowtip { font-size:12px; color:var(--muted); background:rgba(90,169,230,.08); border:1px solid rgba(90,169,230,.25);
      border-radius:7px; padding:5px 9px; margin:0 0 8px; } .flowtip b { color:var(--acc); }
  #turnbar .turn { font-size:20px; font-weight:700; color:var(--acc); }
  #turnbar .phase { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
          background:#2e323a; border:1px solid var(--acc); border-radius:11px; padding:2px 11px; }
  #turnbar .who { color:var(--muted); font-size:12px; }

  /* turn-plan action bar — sticky footer, near the hand where you're choosing */
  #planbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 0;
      position:sticky; bottom:0; z-index:6;
      background:#1f2530; border:1px solid var(--good); border-radius:9px; padding:9px 12px;
      box-shadow:0 -6px 18px rgba(0,0,0,.45); }
  #planbar .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--good); font-weight:600; }
  #planbar .chips { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  #planbar .chip { display:inline-flex; align-items:center; gap:5px; background:#2a313b; border:1px solid var(--line);
      border-radius:13px; padding:2px 6px 2px 4px; font-size:12px; }
  #planbar .chip .n { background:var(--good); color:#0c1116; border-radius:9px; width:17px; height:17px;
      font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  #planbar .chip.land .nm { color:var(--land); } #planbar .chip.spell .nm { color:var(--spell); }
  #planbar .chip .x { cursor:pointer; color:var(--muted); margin-left:2px; } #planbar .chip .x:hover { color:var(--bad); }
  #planbar .chip.aura { cursor:grab; } #planbar .chip.aura:active { cursor:grabbing; }   /* drag onto a creature to (re)aim */
  .enchgroup .aura-plan { cursor:grab; }
  #planbar .empty { color:var(--muted); font-size:12px; flex:1; }

  /* big result banner */
  #banner { display:none; position:sticky; top:0; z-index:20; padding:14px 20px; border-radius:10px;
            font-size:24px; font-weight:800; letter-spacing:.01em; margin:0 0 14px; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  #banner.win  { background:linear-gradient(180deg,rgba(90,209,122,.28),rgba(90,209,122,.14)); color:var(--good); border:1px solid #3a8a54; }
  #banner.loss { background:linear-gradient(180deg,rgba(230,105,90,.26),rgba(230,105,90,.12)); color:var(--bad);  border:1px solid #7a3838; }
  #banner small { display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:3px; letter-spacing:0; }
  .life b.opp.dead { color:#fff; background:var(--bad); border-radius:5px; padding:0 7px; }

  .lifebar { display:flex; gap:26px; align-items:center; margin:4px 0 2px; }
  .life { font-size:13px; color:var(--muted); } .life b { font-size:22px; }
  .life b.you { color:var(--good); } .life b.opp { color:var(--bad); } .life b.lo { color:var(--bad); }
  .midline { height:0; border-top:1px dashed rgba(230,105,90,.35); margin:10px 0 6px; }

  .fieldrow { display:flex; gap:14px; align-items:flex-start; }
  .fieldrow .perms { flex:1; min-width:0; }
  .fieldrow .turnspells { width:240px; flex:none; border-left:1px solid var(--line); padding-left:14px; }

  .zone h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
             margin:14px 0 7px; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .zone h3 .help { color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; margin-left:8px; font-size:11px; }
  .turnspells h3, #stagewrap h3 { color:var(--good); border-color:rgba(90,209,122,.3); }
  .row { display:flex; flex-wrap:wrap; gap:8px; min-height:8px; }
  /* rows holding planned (this-turn) cards: the order# and ✕ badges overhang each thumb by ~7px,
     so widen the gap past 14px (7+7) so adjacent queued cards' badges don't collide. */
  .row.padrow { gap:20px 16px; }
  .zone.lands { opacity:.97; } .zone.gy { opacity:.6; } .zone.gy .thumb { width:46px; } .zone.gy .thumb em { display:none; }
  .zone.oppz h3 { color:var(--bad); border-color:rgba(230,105,90,.25); }
  .hint { color:var(--muted); font-size:12px; }
  /* top-bar badge shown when this (deck,seed,game#) already has a saved reference game */
  .refnote { font-size:12px; font-weight:600; color:#0c1116; background:var(--acc); border-radius:8px;
             padding:2px 9px; white-space:nowrap; }

  .thumb { width:90px; text-align:center; position:relative; }
  .thumb.sm { width:62px; }
  .thumb img { width:100%; border-radius:6px; display:block; background:#0b0c0e; min-height:64px; }
  /* tapped permanent: rotate the art a full 90° clockwise like a real tapped card + a corner badge.
     The card stays FULL SIZE (90px wide image, same as untapped); rotated 90° it becomes ~126px
     wide, so the cell is widened to 126px to reserve that landscape room — neighbors shift over
     instead of overlapping. Cell height is unchanged, so tapped/untapped cells still line up in a
     row (the tapped one is just wider). */
  .thumb.tapped { width:126px; }
  .thumb.tapped img { width:90px; margin:0 auto; transform:rotate(90deg); opacity:.82; filter:saturate(.85); }
  .thumb .tapbadge { position:absolute; top:2px; left:2px; background:rgba(120,120,130,.92); color:#0c1116;
      border-radius:4px; font-size:10px; font-weight:700; padding:0 4px; z-index:2; }
  .thumb em { font-style:normal; font-size:10px; color:var(--muted); display:block; line-height:1.12; margin-top:3px; }
  .thumb.land em { color:var(--land); } .thumb.spell em { color:var(--spell); }
  .thumb .pip { position:absolute; top:2px; right:2px; font-size:10px; color:var(--muted);
      background:rgba(11,12,14,.82); border-radius:4px; padding:0 4px; z-index:2; }
  /* counter badges on a permanent — one colored circle per counter kind, hover for a tooltip.
     Multiple kinds (rare) stack left-to-right so each is distinguishable. */
  .thumb .cnts { position:absolute; bottom:2px; left:2px; display:flex; gap:2px; z-index:3; }
  .thumb .cnt { min-width:16px; height:16px; padding:0 3px; border-radius:9px; font-size:10px; font-weight:700;
      display:flex; align-items:center; justify-content:center; color:#0c1116; box-shadow:0 0 0 1px rgba(0,0,0,.55); cursor:help; }
  .thumb .cnt.p1p1{ background:var(--good); } .thumb .cnt.m1m1{ background:var(--bad); }
  .thumb .cnt.loyalty{ background:var(--warn); } .thumb .cnt.poison{ background:#9a6ad1; }
  .thumb .cnt.depletion{ background:var(--land); } .thumb .cnt.charge{ background:var(--acc); }
  .thumb .cnt.verse{ background:#e69a5a; } .thumb .cnt.storage{ background:#e3b23c; }
  .thumb .cnt.age{ background:#8a7fb5; }   /* cumulative upkeep (Varchild's War-Riders) */
  /* floating (unspent) mana, shown beside the Lands header */
  .floatmana { margin-left:10px; display:inline-flex; gap:3px; vertical-align:middle; }
  .mpip { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px;
      border-radius:9px; font-size:11px; font-weight:700; color:#0c1116; box-shadow:0 0 0 1px rgba(0,0,0,.45); }
  /* staged (exiled-but-playable) cards: set apart at the right of the hand with a purple ring */
  .hand .stagedsep { align-self:center; color:#b794d6; font-size:11px; font-weight:600; line-height:1.2;
      border-left:2px solid #5a4a6a; padding-left:10px; margin-left:6px; max-width:90px; }
  .hand .thumb.staged img { box-shadow:0 0 0 2px #9a6ad1; }
  .hand .thumb .stagedbadge { position:absolute; top:2px; left:2px; background:rgba(154,106,209,.95); color:#0c1116;
      border-radius:4px; font-size:9px; font-weight:700; padding:0 3px; z-index:2; }
  /* Suspend zone (incoming, beside lands) + Exiled-unusable zone (gone-for-good, beside graveyard) */
  .zone.suspend h3 { color:#7fb0e0; }
  .zone.exiledead h3 { color:#8fa0c0; } .zone.exiledead { opacity:.75; }
  .fieldrow .lands, .fieldrow .gy { flex:1; min-width:0; }
  .fieldrow .suspend, .fieldrow .exiledead { width:210px; flex:none; border-left:1px solid var(--line); padding-left:14px; }
  .thumb.staged .stagedbadge { position:absolute; top:2px; left:2px; background:rgba(154,106,209,.95); color:#0c1116;
      border-radius:4px; font-size:9px; font-weight:700; padding:0 3px; z-index:2; }
  .thumb.pending img { box-shadow:0 0 0 2px #5a96e1; }                                   /* suspended — incoming */
  .thumb.noplay img { opacity:.5; filter:grayscale(.35); box-shadow:0 0 0 2px #6b7280; } /* exiled — unusable */
  .stagedbadge.susp   { background:rgba(90,150,225,.95) !important; }
  .stagedbadge.noplay { background:rgba(150,155,165,.95) !important; }
  /* Aether Vial: the permanent is a clickable deploy source; matching-MV hand creatures light up */
  .thumb.vial-src { cursor:pointer; box-shadow:0 0 0 1px var(--acc) inset; }
  .thumb.vial-src.active img { box-shadow:0 0 0 2px var(--acc), 0 0 10px rgba(90,169,230,.55); }
  .hand .thumb.vialhot { cursor:pointer; box-shadow:0 0 0 2px var(--acc); }
  .hand .thumb.vialhot:hover { box-shadow:0 0 0 2px #8fc7f0, 0 0 8px rgba(90,169,230,.5); }
  /* Retrace: a graveyard card you can cast from there */
  .zone.gy .thumb.retrace-src { cursor:pointer; opacity:1; box-shadow:0 0 0 2px #c98a3a; }
  .zone.gy .thumb.retrace-src:hover { box-shadow:0 0 0 2px #e6a94c, 0 0 8px rgba(201,138,58,.5); }
  .thumb .rtbadge { position:absolute; top:2px; left:2px; background:rgba(201,138,58,.95); color:#0c1116;
      border-radius:4px; font-size:11px; font-weight:700; padding:0 4px; z-index:2; }
  /* source badge on a planned (this-turn) vial/retrace card */
  .thumb.planned .srcbadge { position:absolute; bottom:2px; right:2px; border-radius:4px; font-size:10px;
      font-weight:700; padding:0 3px; z-index:3; color:#0c1116; }
  .thumb.planned .srcbadge.vial { background:var(--acc); } .thumb.planned .srcbadge.retrace { background:#e6a94c; }
  .thumb.planned .srcbadge.act { background:#c58cf0; }
  #planbar .chip.vial { border-color:var(--acc); background:#1f2d3a; } #planbar .chip.vial .nm { color:var(--acc); }
  #planbar .chip.retrace { border-color:#7a5a2e; background:#332817; } #planbar .chip.retrace .nm { color:#e6a94c; }
  #planbar .chip.act { border-color:#6b4a8a; background:#2a1f33; } #planbar .chip.act .nm { color:#c58cf0; }
  /* planned (this-turn) card: green ring + order badge + remove */
  .thumb.planned img { box-shadow:0 0 0 2px var(--good); }
  .thumb.planned.aura-plan { cursor:grab; }   /* untargeted queued aura: drag onto a creature (issue #11) */
  .thumb.planned .ord { position:absolute; top:-7px; left:-7px; background:var(--good); color:#0c1116;
      border-radius:11px; width:20px; height:20px; font-size:12px; font-weight:700; z-index:3;
      display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #0b0c0e; }
  .thumb.planned .rm { position:absolute; top:-7px; right:-7px; background:var(--bad); color:#0c1116; cursor:pointer;
      border-radius:11px; width:18px; height:18px; font-size:12px; font-weight:700; z-index:3;
      display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #0b0c0e; }

  /* hand palette */
  .hand .thumb { cursor:pointer; transition:transform .1s; }
  .hand .thumb:hover { transform:translateY(-4px); }
  .hand .thumb img { box-shadow:0 0 0 1px var(--line); }
  .hand .thumb.queued img { box-shadow:0 0 0 2px var(--good); opacity:.45; }
  .hand .thumb .qct { position:absolute; top:-6px; right:-6px; background:var(--good); color:#0c1116;
      border-radius:11px; min-width:18px; height:18px; font-size:11px; font-weight:700;
      display:flex; align-items:center; justify-content:center; z-index:2; padding:0 4px; }
  .hand .thumb .draws { position:absolute; top:2px; left:2px; background:rgba(127,179,255,.92); color:#0c1116;
      border-radius:4px; font-size:9px; font-weight:700; padding:0 4px; z-index:2; }
  /* Land's Edge: the source permanent, the activation mode, and the discard zone */
  .thumb.le-src { cursor:pointer; box-shadow:0 0 0 1px #7a5a1e inset; }
  .thumb.le-src.active { box-shadow:0 0 0 2px #ffb84d, 0 0 10px rgba(255,184,77,.5); }
  .thumb .lebadge { position:absolute; top:2px; left:2px; background:rgba(255,184,77,.95); color:#0c1116;
      border-radius:4px; font-size:9px; font-weight:700; padding:0 3px; z-index:2; }
  .hand .thumb.lehot { cursor:pointer; box-shadow:0 0 0 2px #ffb84d; }
  .hand .thumb.lehot:hover { box-shadow:0 0 0 2px #ffd27f, 0 0 8px rgba(255,184,77,.45); }
  .hand .thumb.spent { opacity:.42; }
  .hand .thumb .lealloc { position:absolute; bottom:2px; right:2px; background:rgba(255,184,77,.95); color:#0c1116;
      border-radius:4px; font-size:10px; font-weight:700; padding:0 3px; z-index:2; }
  /* Dig abilities: cycling (a land in HAND) + sacrifice-to-draw (Fiery Islet on the board). Single-click. */
  .thumb .digbadge { position:absolute; bottom:2px; left:2px; background:rgba(90,200,180,.95); color:#0c1116;
      border-radius:4px; font-size:9px; font-weight:700; padding:0 3px; z-index:2; cursor:pointer; }
  .thumb.sac-src { cursor:pointer; box-shadow:0 0 0 1px #2f8f7e inset; }
  .thumb.sac-src:hover { box-shadow:0 0 0 2px #5ac8b4, 0 0 8px rgba(90,200,180,.45); }
  .hand .thumb.cyc-src { cursor:pointer; }
  .hand .thumb.cyc-src:hover { box-shadow:0 0 0 2px #5ac8b4, 0 0 8px rgba(90,200,180,.4); }
  /* Activated ability of a permanent already in play (Krenko's token tap, a Goblin sac outlet).
     Single-click queues one activation; the ring turns solid once at least one is queued. */
  .thumb .actbadge { position:absolute; bottom:2px; left:2px; background:rgba(197,140,240,.95); color:#0c1116;
      border-radius:4px; font-size:9px; font-weight:700; padding:0 3px; z-index:2; cursor:pointer; }
  .thumb.act-src { cursor:pointer; box-shadow:0 0 0 1px #6b4a8a inset; }
  .thumb.act-src:hover { box-shadow:0 0 0 2px #c58cf0, 0 0 8px rgba(197,140,240,.45); }
  .thumb.act-src.act-on img { box-shadow:0 0 0 2px #c58cf0; }
  .zone.ledrop { border:1px dashed #7a5a1e; border-radius:10px; background:rgba(58,47,27,.35); padding:2px 6px; }
  .zone.ledrop.active { border-color:#ffb84d; background:rgba(58,47,27,.6); }
  /* divided-damage board editor: an inline −[n]+ stepper on each legal target (Fiery Justice / Magma Opus). */
  .divw { display:inline-flex; align-items:center; gap:1px; vertical-align:middle; z-index:5;
      background:rgba(230,90,90,.95); border-radius:6px; padding:1px; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .divw.face { margin-left:6px; }
  .thumb .divw { position:absolute; bottom:3px; left:50%; transform:translateX(-50%); }
  .divw button { width:16px; height:18px; border:0; border-radius:4px; background:rgba(0,0,0,.35); color:#fff;
      font-size:13px; line-height:1; cursor:pointer; padding:0; }
  .divw button:hover { background:rgba(0,0,0,.6); }
  .divw input { width:24px; height:18px; border:0; border-radius:3px; text-align:center; font-size:12px;
      font-weight:700; background:#fff; color:#111; -moz-appearance:textfield; }
  .divw input::-webkit-outer-spin-button, .divw input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  /* divide targets: BLUE while a potential target (0 assigned), RED once damage is assigned (>0) --
     i.e. actually targeted -- to match the rest of the targeting UI (.selected / .facetgt.selected). */
  .thumb.divtgt img { box-shadow:0 0 0 2px var(--acc), 0 0 10px rgba(90,169,230,.4); }
  .thumb.divtgt.divon img { box-shadow:0 0 0 3px var(--bad), 0 0 12px rgba(230,105,90,.6); }
  .life b.facetgt.divon { box-shadow:0 0 0 3px var(--bad); background:rgba(230,105,90,.18); }
  /* the order-number and ✕ badges overhang each thumb by ~7px, so give the activation list
     extra horizontal+vertical gap to stop adjacent badges from colliding */
  .zone.ledrop .row { gap:22px 20px; padding:6px 4px; }
  .zone.ledrop h3 { color:#ffb84d; }
  .zone.ledrop .lehint { font-weight:400; color:var(--muted); font-size:11px; margin-left:6px; }
  #planbar .chip.le { border-color:#7a5a1e; background:#3a2f1b; }
  #planbar .chip.le .nm { color:#ffb84d; }
  #drawtip { font-size:12px; color:var(--spell); margin-left:6px; }
  /* drag-drop target is the PLAY FIELD (where cards get played), not the hand */
  #playfield { border:1px dashed transparent; border-radius:10px; padding:2px 6px; transition:border-color .1s, background .1s; }
  #playfield.drop-hi { border-color:var(--good); background:rgba(90,209,122,.06); }
  #playfield .dh { color:var(--good); font-size:11px; opacity:0; transition:opacity .1s; }
  #playfield.drop-hi .dh { opacity:1; }
  /* Aura enchanting a creature: the auras fan behind the creature (right + slightly down), like
     tucking them under the card in paper. The creature (.base) stays on top and fully visible; each
     Aura peeks out. A drop-target creature highlights while dragging an Aura from hand. */
  .enchgroup { position:relative; display:inline-block; vertical-align:top; }
  .enchgroup .thumb.base { position:relative; z-index:40; display:inline-block; width:90px; }  /* inline-block so width applies outside a flex row (else img width:100% blows up) */
  .enchgroup .aura-att, .enchgroup .aura-plan { position:absolute; left:0; width:90px; }  /* full size (== creature) so the name reads; stacked behind, top-bar peeks */
  .enchgroup .aura-att em, .enchgroup .aura-plan em { display:none; }   /* only the top bar (name) shows */
  .enchgroup .aura-att img  { box-shadow:0 0 0 1px rgba(230,200,120,.6), 0 2px 5px rgba(0,0,0,.5); }   /* resolved: gold */
  .enchgroup .aura-plan img { box-shadow:0 0 0 2px var(--good), 0 2px 5px rgba(0,0,0,.5); }             /* queued: green */
  .enchgroup .enchbadge { position:absolute; left:-6px; z-index:60; background:rgba(230,200,120,.95);
    color:#0c1116; border-radius:9px; font-size:10px; font-weight:800; padding:1px 5px; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .thumb.enchdrop img { box-shadow:0 0 0 3px var(--good), 0 0 12px rgba(90,209,122,.6) !important; cursor:copy; }
  /* Light-Paws picker: the "not fetchable" section sits below the real choices, dimmer and smaller. */
  .illsub { margin-top:12px; padding-top:8px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
  .illgrid .cardmini { width:52px; opacity:.42; filter:grayscale(.4); }
  .illgrid .cardmini em { font-size:9px; }

  /* card thumbnails inside the choose-variant picker */
  #verdict .vthumbs { display:flex; gap:6px; margin:4px 0 2px; flex-wrap:wrap; }
  #verdict .vthumbs img { width:54px; border-radius:5px; background:#0b0c0e; }
  #verdict .variant { display:flex; gap:8px; align-items:center; }
  #verdict .variant .vlab { text-align:left; }

  /* what-changed strip */
  #effects { margin:8px 0 4px; }
  #effects .ef { display:inline-flex; gap:5px; align-items:center; font-size:12px; padding:3px 9px; margin:0 6px 6px 0;
      border-radius:7px; background:#262b32; border:1px solid var(--line); }
  #effects .ef.add { border-color:#2f5a3c; color:var(--good); } #effects .ef.gy { border-color:#5a4030; color:var(--land); }
  #effects .ef.gone { border-color:#444; color:var(--muted); } #effects .ef.draw { border-color:#2f4055; color:var(--spell); }

<body>
<header>
  <h1>MagicDeckTester — Play</h1>
  <label>Deck <select id="deck"></select></label>
  <label>Seed <input id="seed" type="number" value="1"/></label>
  <label>Max turns <input id="maxturns" type="number" value="8"/></label>
  <button id="newgame" class="primary">New game</button>
  <button id="nextgame" title="increment Seed + Game# and start a fresh game">Next game ▸</button>
  <button id="undo" disabled>Undo</button>
  <button id="optbtn" title="Decision options — pick which decisions to surface vs. let the AI decide">⚙ Options</button>
  <span id="refnote" class="refnote" style="display:none"></span>
  <span class="hint">no clairvoyance — your win-turn is a ground-truth bound</span>
</header>

<main>
  <section id="board"><div class="hint">Start a new game.</div></section>
  <aside id="side">
    <div id="verdict"></div>
    <div id="vialslot"></div>
    <h2>History</h2>
    <ul id="hist" class="hist"></ul>
    <div id="endcontrols" style="display:none; margin-top:14px;">
      <button id="saveref" class="primary">Save as reference</button>
      <button id="saveref-sub" style="display:none;" title="You believe this game is winnable on an EARLIER turn — saved to references/suboptimal/ as a target, not the verified set.">Save as suboptimal (should be faster)</button>
      <div id="saveinfo"></div>
    </div>
  </aside>
</main>
<div id="decback"></div>
<div id="decpanel"></div>
<div id="optmenu" style="display:none"></div>

<!-- Shared, DOM-free line-building logic (also require()d by test/viewer_linebuild_check.js). -->
<script src="/linebuild.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// Names the engine flags as MDFC back faces (e.g. "Boulderloft Pathway"). A back face's default
// Scryfall image is its FRONT, so we must ask for &face=back. Populated from each decision's mdfc_backs.
const MDFC_BACKS = new Set();
const scryImg = (name, ver) => 'https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name)+'&format=image&version='+(ver||'small')+(MDFC_BACKS.has(name)?'&face=back':'');

// S.plan is the ordered turn plan: [{name, kind}] in the sequence the player queued them.
// kind: 'land' | 'permanent' | 'spell'(instant/sorcery). At most one land.
let S = { choices:[], history:[], decision:null, prev:null, over:false, result:null,
          plan:[], hadReject:false, busy:false, leMode:false, vialMode:null, firebreathe:{}, storageHold:{}, castOrder:{} };

function cfg(extra) {
  return Object.assign({
    deck:$('deck').value, seed:+$('seed').value, gameIndex:Math.max(0,(+$('seed').value||0)-1),
    maxTurns:+$('maxturns').value, depth:0, choices:S.choices,
    firebreathe:S.firebreathe||{},   // #4 turn-keyed side-channel (separate from the positional choices)
    storageHold:S.storageHold||{},   // #6 (turn,land_idx)-keyed tap-vs-charge side-channel
    castOrder:S.castOrder||{},       // #10 main-ordinal-keyed cast-order side-channel
  }, extra || {});
}
async function post(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return r.json();
}

// ---- plan helpers ----------------------------------------------------------
// The pure line-building logic lives in linebuild.js (LineBuild), the ONE copy shared with the
// frontend regression check (test/viewer_linebuild_check.js) so a saved reference's line can be
// reconstructed headlessly. These wrappers just bind the browser's S state to it; keep them thin.
const LB = window.LineBuild;
function planLand()        { return LB.planLand(S.plan); }
function handCounts()      { return LB.handCounts(S.decision); }
function stagedCounts()    { return LB.stagedCounts(S.decision); }
function plannedCount(name){ return LB.plannedCount(S.plan, name); }
function leCount()         { return LB.leCount(S.plan); }
function leMax()           { return LB.leMax(S.decision, S.plan); }
function encodeLine()      { return LB.encodeLine(S.plan); }
function queueCard(name, kind, target, targetName) {
  if (S.over || !S.decision || S.decision.type!=='main_phase') return;  // UI guard (browser-only state)
  hideVerdict();
  const before = S.plan.length;
  S.plan = LB.queueCard(S.decision, S.plan, name, kind);
  if (S.plan.length > before) {
    const e = S.plan[S.plan.length-1];
    // If a drag chose a specific enchant target, stamp it on the entry LB.queueCard just appended (it
    // pushes at the end). At commit, encodeLine stays target-free; renderChooseDialog auto-resolves the
    // aura's enchant sub to this target (see enchantPrefFor), so the drag picks the creature end-to-end.
    if (target != null && e && e.name===name) { e.target = target; e.targetName = targetName || null; }
    // Stamp the stable card number of the hand copy being played, so a queued CREATURE is itself a
    // drop target for a same-turn Aura (drag Rancor onto a Bogle you're casting this turn). Pick a hand
    // copy of this name not already claimed by another queued entry.
    if (e && e.name===name && e.kind!=='land' && e.num==null) {
      const used = new Set(S.plan.filter(p=>p.num!=null).map(p=>p.num));
      const hc = (((S.decision||{}).me||{}).hand||[]).find(c=>c.name===name && !used.has(c.num));
      if (hc) e.num = hc.num;
    }
  }
  renderBoard();
}
function removePlanAt(i) { S.plan.splice(i,1); renderBoard(); }
// Legal enchant targets a hand Aura can attach to, harvested from the enumerated plans (every
// (aura, target) the engine offers appears as an action with enchant_target). Returns a map
// num -> creature name; empty for a non-Aura (so drop-to-enchant only fires for real auras).
function enchantTargetsFor(name) {
  const d = S.decision, out = {};
  if (!d || !Array.isArray(d.plans)) return out;
  d.plans.forEach(pl => (pl.actions||[]).forEach(a => {
    if (a.card===name && a.enchant_target>0) out[a.enchant_target] = a.enchant_target_name || ('#'+a.enchant_target);
  }));
  return out;
}
// Attempt a drag-drop of hand card `name` onto the creature with m_number `num`. Only auras with `num`
// among their legal targets enchant; anything else falls through so the caller queues it normally.
function tryEnchantDrop(name, kind, num) {
  const tgts = enchantTargetsFor(name);
  if (!(num in tgts)) return false;
  queueCard(name, kind, num, tgts[num]);
  flashHint(`Enchanting ${tgts[num]} with ${name}.`);
  return true;
}
// The creature name the user dragged `auraName` onto this turn (null if it was queued without a drag).
// Used by the choose dialog to auto-resolve the aura's enchant target instead of re-asking.
function enchantPrefFor(auraName) {
  const e = (S.plan||[]).find(p=>p.name===auraName && p.targetName);
  return e ? e.targetName : null;
}
// Re-aim an ALREADY-PLANNED Aura by dragging its plan chip (or its board overlap) onto a legal
// creature. Unlike tryEnchantDrop (which queues a fresh copy from hand), this just re-stamps the
// existing plan entry's target — so dragging a mis-aimed queued aura moves it, never duplicates it.
function retargetPlanAura(planIdx, num) {
  const e = S.plan[planIdx]; if (!e) return false;
  const tgts = enchantTargetsFor(e.name);
  if (!(num in tgts)) { flashHint(`${e.name} can’t enchant that creature.`); return false; }
  e.target = num; e.targetName = tgts[num];
  flashHint(`Enchanting ${tgts[num]} with ${e.name}.`);
  renderBoard();
  return true;
}
function clearPlan() { S.plan=[]; S.leMode=false; S.vialMode=null; hideVerdict(); renderBoard(); }

// ---- rendering -------------------------------------------------------------
// Colored counter badges for a permanent {counters:[{kind,label,count}]}. One circle per kind.
function counterBadges(o) {
  if (!o.counters || !o.counters.length) return '';
  return `<span class="cnts">`+o.counters.map(c=>{
    const plural = c.count===1 ? '' : 's';
    return `<span class="cnt ${esc(c.kind)}" title="${esc(c.count+' '+c.label+' counter'+plural)}">${esc(c.count)}</span>`;
  }).join('')+`</span>`;
}
// Floating (unspent) mana pips beside the Lands header. me.floating_mana is absent when empty.
function floatingManaHtml(me) {

  //     shown beside the Graveyard (below). Playable staged SPELLS stay in the Hand (purple ▸T badge).
  const exThumb = c => {
    const susp = c.reason==='suspend';
    const badge = susp
      ? `<span class="stagedbadge susp" title="suspended — arrives turn ${c.arrive_turn} (${c.time_counters} time counter${c.time_counters===1?'':'s'} left)">⌛${c.time_counters}</span>`
      : `<span class="stagedbadge noplay" title="exiled by Apex of Power — a land can't be cast (spells only), so it stays in exile">⊘</span>`;
    return `<span class="thumb staged ${c.kind==='land'?'land':'spell'} ${susp?'pending':'noplay'}" data-name="${esc(c.name)}" `+
      `title="${esc(c.name)} — ${susp?`suspended, arrives T${c.arrive_turn}`:'exiled, not playable'}">`+
      `<img loading="lazy" src="${scryImg(c.name,'small')}" onerror="this.style.opacity=.15"/>`+
      badge+`<em>${esc(c.name)}</em></span>`;
  };
  const suspendCards = (me.exile||[]).filter(c=>c.reason==='suspend');
  const exiledDead   = (me.exile||[]).filter(c=>c.reason!=='suspend');
  const landsZone = `<div class="zone lands"><h3>Lands (${meLands.length+plannedLands.length})${floatingManaHtml(me)}</h3>`+zoneRow(meLands.concat(plannedLands), plannedLands.length?'padrow':'')+`</div>`;
  if (suspendCards.length)
    h += `<div class="fieldrow">${landsZone}<div class="zone suspend"><h3>Suspended (${suspendCards.length})</h3>`+zoneRow(suspendCards.map(exThumb))+`</div></div>`;
  else h += landsZone;
  h += `</div>`;  // /playfield
  // Hand sits ABOVE the graveyard: it is the most-used zone, so keeping it high (right under your
  // field) means the turn bar and hand are visible together without scrolling. The graveyard (less
  // important) drops to the bottom.
  // hand palette: interactive (drag/queue) in the main phase; a read-only reference row during a
  // sub-decision (so the board+hand stay visible while you resolve scry/target/bounce/vial).
  if (isMain) h += `<div class="zone hand" id="handzone"><h3>Hand <span class="help">double-click = cast/play · drag onto your field above`+
       (d.lands_edge?(S.leMode?` · ⚡ <b>Land’s Edge active</b> — click lands to discard (${d.lands_edge.rate} dmg each)`:` · ⚡ click your Land’s Edge to discard lands to it`):` · single-click = activate ability`)+`</span></h3>`+
       `<div class="row" id="handrow"></div></div>`;
  else if (dec && (me.hand||[]).length) {
    // Read-only hand during a sub-decision. Staged (exiled-but-playable) cards are shown in a
    // set-apart section with a purple ring/badge -- NOT counted in the hand total and NOT lumped in
    // with real hand cards (else e.g. a real + a staged Lightning Bolt read as "2 in hand").
    const hnorm = me.hand.filter(c=>!(c&&c.is_staged));
    const hstg  = me.hand.filter(c=>c&&c.is_staged);
    let hrow = hnorm.map(c=>bfThumb({name:typeof c==='string'?c:c.name,is_land:(c&&c.kind==='land')})).join('');
    if (hstg.length) {
      const seen=new Set(); let stg='';
      for (const c of hstg) {
        const k=c.name+'@'+c.staged_until; if(seen.has(k)) continue; seen.add(k);
        const n=hstg.filter(x=>x.name+'@'+x.staged_until===k).length;
        stg += `<span class="thumb staged ${c.kind==='land'?'land':'spell'}" data-name="${esc(c.name)}">`+
          `<img loading="lazy" src="${scryImg(c.name,'small')}" onerror="this.style.opacity=.15"/>`+
          `<span class="stagedbadge" title="exiled — playable through turn ${c.staged_until}">▸T${c.staged_until}</span>`+
          (n>1?`<span class="pip">×${n}</span>`:'')+`<em>${esc(c.name)}</em></span>`;
      }
      hrow += `<span class="stagedsep">⟂ exiled<br>playable</span>`+stg;
    }
    h += `<div class="zone hand"><h3>Hand (${hnorm.length})</h3><div class="row">`+(hrow||'<span class="hint">none</span>')+`</div></div>`;
  }
  if (me.graveyard && me.graveyard.length) {
    const rset = new Set(me.retrace_gy||[]);   // graveyard spells castable via Retrace
    const gyThumbs = me.graveyard.map(n => rset.has(n)
      ? `<span class="thumb spell retrace-src" data-name="${esc(n)}" data-retrace="1" title="click to cast from graveyard via Retrace (discards a land)">`+
        `<img loading="lazy" src="${scryImg(n,'small')}" alt="${esc(n)}" onerror="this.style.opacity=.15"/>`+
        `<span class="rtbadge" title="Retrace — cast from here, discarding a land">↩</span><em>${esc(n)}</em></span>`
      : bfThumb({name:n,is_land:false}));
    const hint = rset.size ? ` <span class="help">↩ click a Retrace card to cast it from here (discards a land)</span>` : '';
    var gyZone = `<div class="zone gy"><h3>Graveyard (${me.graveyard.length})${hint}</h3>`+zoneRow(gyThumbs)+`</div>`;
  }
  // Exiled — unusable: Apex-exiled LANDS (gone for good), shown beside the graveyard (a "second
  // graveyard" of cards you can never use). Suspended cards live beside the Lands instead.
  {
    var gy = (typeof gyZone === 'string') ? gyZone : '';
    var deadZone = exiledDead.length
      ? `<div class="zone exiledead"><h3>Exiled — unusable (${exiledDead.length})</h3>`+zoneRow(exiledDead.map(exThumb))+`</div>`
      : '';
    if (gy && deadZone) h += `<div class="fieldrow">${gy}${deadZone}</div>`;
    else h += gy + deadZone;
  }
  // sticky commit/turn-plan footer, last so its position:sticky bottom:0 docks to the viewport.
  if (isMain) h += `<div id="planbar"></div>`;
  board.innerHTML = h;
  renderBanner(); renderEffects(); if(isMain){ renderPlanbar(); renderHand(); } wireBoard();
  if (dec) { wireDecisionBoard(d, dec); renderDecisionPanel(d, dec); } else hideDecPanel();
}

function renderBanner() {
  const b=$('banner'); if(!b) return;
  if (S.over && S.result) { const r=S.result; b.style.display='block';
    b.className = r.won?'win':'loss';
    const oppFin = r.opponent_life!=null ? ` · opponent at ${r.opponent_life}` : '';
    b.innerHTML = r.won ? `🏆 Won — Turn ${r.win_turn}<small>${r.decisions_made} decisions · no clairvoyance${oppFin}</small>`
                        : `✖ No win within ${$('maxturns').value} turns<small>${r.decisions_made} decisions${oppFin}</small>`;
  } else b.style.display='none';
}

function renderPlanbar() {
  const pb=$('planbar'); if(!pb) return;
  const rate = (S.decision.lands_edge&&S.decision.lands_edge.rate)||0;
  // Non-LE entries get their own chip; all Land's Edge discards collapse into one summary chip
  // (per-land removal lives in the discard zone), appended at the end.
  const chips = S.plan.map((p,i)=>{
    if (p.kind==='le') return '';
    const cls = p.kind==='vial'?'vial':p.kind==='retrace'?'retrace':p.kind==='activate'?'act':(p.kind==='land'?'land':'spell');
    const tag = (p.kind==='vial'?' ⚡':p.kind==='retrace'?' ↩':p.kind==='activate'?' ⟳ ability':'')
              + (p.targetName?` → ${esc(p.targetName)}`:'');
    // An Aura chip (something with legal enchant targets) is draggable onto a creature to (re)aim it.
    const isAura = p.kind!=='land' && p.kind!=='activate' && Object.keys(enchantTargetsFor(p.name)).length>0;
    const drag = isAura ? ` draggable="true" data-pi="${i}" title="drag onto a creature to enchant it"` : '';
    return `<span class="chip ${cls}${isAura?' aura':''}"${drag}><span class="n">${i+1}</span>`+
      `<span class="nm" data-name="${esc(p.name)}">${esc(p.name)}${tag}</span><span class="x" data-rm="${i}">✕</span></span>`;
  }).join('');
  const nLE = leCount();
  const leChip = nLE ? `<span class="chip le"><span class="nm">⚡ Land’s Edge ×${nLE} → ${nLE*rate} dmg</span></span>` : '';
  const empty = !S.plan.length;
  // Tip when a draw spell is queued: it re-prompts after drawing; queuing a land too spends the drop.
  const drawNames = new Set((S.decision.me.hand||[]).filter(c=>c.is_draw).map(c=>c.name));
  const planHasDraw = S.plan.some(p=>drawNames.has(p.name));
  const planHasLand = !!planLand();
  const tip = planHasDraw
    ? `<span id="drawtip">↻ draws — you’ll re-decide after${planHasLand?'; the queued land uses your drop (drop a draw spell <b>without</b> a land to play a revealed one)':''}</span>`
    : '';
  // Buttons FIRST (left edge, next to the hand) so Commit/Clear are within easy reach while
  // you build the line; the Turn-plan label + chips follow and the chips flex to fill the rest.
  pb.innerHTML = `<button id="commit" class="primary" title="${empty?'Pass just THIS phase — you\'ll still get Main 2 to cast in (use Pass turn to skip the whole turn)':'Commit this line; you stay in this phase to re-decide if it draws a card or opens an ability (e.g. a same-turn Horizon Canopy sac)'}">${empty?'Pass phase':'Commit Line'}</button>`+
    `<button id="committurn" class="primary" title="${empty?'Do nothing this turn and skip to the next turn':'Commit this line, then auto-pass the rest of this turn (skip Main 2 / any re-prompts)'}">${empty?'Pass turn':'Commit turn'}</button>`+
    (empty?'':`<button id="clearp" class="ghost">Clear</button>`)+
    `<span class="lbl">Turn plan</span>`+
    (empty?`<span class="empty">double-click or drag cards in hand to build a line</span>`:`<div class="chips">${chips}${leChip}</div>`)+
    tip;
  $('commit').onclick = commitLine;
  $('committurn').onclick = commitTurn;
  if ($('clearp')) $('clearp').onclick = clearPlan;
  pb.querySelectorAll('.x[data-rm]').forEach(x=>x.onclick=()=>removePlanAt(+x.dataset.rm));
  // Aura chips: drag onto a creature in the field to (re)assign the enchant target (routes through
  // the #playfield drop handler via the stamped text/planidx; see retargetPlanAura).
  pb.querySelectorAll('.chip[data-pi]').forEach(ch=>{
    ch.addEventListener('dragstart', e=>{ const i=+ch.dataset.pi;
      e.dataTransfer.setData('text/planidx', String(i));
      S._dragCard=null; S._dragKind=null; S._dragTargets=enchantTargetsFor(S.plan[i].name); });
    ch.addEventListener('dragend', ()=>{ S._dragCard=null; S._dragKind=null; S._dragTargets=null; clearEnchDropHi(); });
  });
}

function renderHand() {
  const row=$('handrow'); if(!row) return;
  const all = S.decision.me.hand||[];
  const normal = all.filter(c=>!c.is_staged);
  const staged = all.filter(c=>c.is_staged);   // exiled-but-playable cards (Light Up the Stage / Soulfire)
  // Persistent left-to-right order: surviving cards keep their place; newly-appeared names (a draw)
  // are appended on the RIGHT so what you drew is visible (the engine's hand order is not draw
  // order). Duplicates collapse into one thumb (×N). Recomputed from S.handOrder (the prior order)
  // each render -> idempotent within a decision, appends across decisions.
  const byName={}; for (const c of normal) if (!(c.name in byName)) byName[c.name]=c;
  const order=(S.handOrder||[]).filter(n=>n in byName);
  const have=new Set(order);
  for (const c of normal) if (!have.has(c.name)) { order.push(c.name); have.add(c.name); }
  S.handOrder=order;
  const counts=handCounts(); let html='';
  for (const name of order) {
    const c=byName[name];
    const land = c.kind==='land';
    const q = land ? (planLand()&&planLand().name===c.name?1:0) : plannedCount(c.name);
    const leN = land ? S.plan.filter(p=>p.kind==='le' && p.name===c.name).length : 0;  // copies moved to Land's Edge
    const total = counts[c.name]||0;
    const spent = land && (q+leN) >= total;          // every copy is played or discarded -> dim it
    const lehot = land && S.leMode && (q+leN) < total;  // a clickable discard target in active mode
    const vialhot = S.vialMode!=null && c.is_creature && c.mv===S.vialMode;  // deployable via the active Vial
    const canCyc = digSources().cyc[c.name] != null;   // a cycling land in hand -- single-click to cycle
    html += `<span class="thumb ${land?'land':'spell'} ${q?'queued':''} ${spent?'spent':''} ${lehot?'lehot':''} ${vialhot?'vialhot':''} ${canCyc?'cyc-src':''}" data-name="${esc(c.name)}" draggable="true" data-card="${esc(c.name)}" data-kind="${c.kind}">`+
      `<img loading="lazy" src="${scryImg(c.name,'small')}" alt="${esc(c.name)}" onerror="this.style.opacity=.15"/>`+
      (leN?`<span class="lealloc" title="${leN} copy/copies discarded to Land’s Edge">⚡${leN}</span>`:'')+
      (c.is_draw?`<span class="draws" title="draws — re-prompts after; commit without a land to play a revealed one">↻ draws</span>`:'')+
      (canCyc?`<span class="digbadge" title="single-click to cycle — discard to draw a card">↻ cycle</span>`:'')+
      (total>1?`<span class="pip">×${total}</span>`:'')+(q?`<span class="qct">${q}</span>`:'')+
      `<em>${esc(c.name)}${c.cost?` <span style="color:var(--muted)">${esc(c.cost)}</span>`:''}</em></span>`;
  }
  // Staged (exiled) cards — playable until end of their listed turn — shown set apart at the right.
  if (staged.length) {
    html += `<span class="stagedsep">⟂ exiled<br>playable</span>`;
    const scounts=stagedCounts();      // name@expiry -> copies (collapse duplicates into one thumb, x N)
    const sseen=new Set();
    for (const c of staged) {
      const key=c.name+'@'+c.staged_until; if(sseen.has(key)) continue; sseen.add(key);
      const land = c.kind==='land';
      const q = land ? (planLand()&&planLand().name===c.name?1:0) : plannedCount(c.name);
      const total = scounts[key]||1;   // how many staged copies of this name/expiry
      html += `<span class="thumb staged ${land?'land':'spell'} ${q?'queued':''}" data-name="${esc(c.name)}" draggable="true" data-card="${esc(c.name)}" data-kind="${c.kind}">`+
        `<img loading="lazy" src="${scryImg(c.name,'small')}" alt="${esc(c.name)}" onerror="this.style.opacity=.15"/>`+
        `<span class="stagedbadge" title="exiled — playable through turn ${c.staged_until}">▸T${c.staged_until}</span>`+
        (total>1?`<span class="pip">×${total}</span>`:'')+(q?`<span class="qct">${q}</span>`:'')+
        `<em>${esc(c.name)}${c.cost?` <span style="color:var(--muted)">${esc(c.cost)}</span>`:''}</em></span>`;
    }
  }
  row.innerHTML = html;
  row.querySelectorAll('.thumb[data-card]').forEach(t => {
    const card=t.dataset.card, kind=t.dataset.kind;
    t.addEventListener('click', () => { if (S._clickT) return;
      S._clickT = setTimeout(()=>{ S._clickT=null; activateAbility(card); }, 220); });
    t.addEventListener('dblclick', () => { if (S._clickT){ clearTimeout(S._clickT); S._clickT=null; } queueCard(card, kind); });
    t.addEventListener('dragstart', e => { e.dataTransfer.setData('text/card', card); e.dataTransfer.setData('text/kind', kind);
      S._dragCard=card; S._dragKind=kind; S._dragTargets=enchantTargetsFor(card); });   // stash for creature drop-highlight
    t.addEventListener('dragend', () => { S._dragCard=null; S._dragKind=null; S._dragTargets=null; clearEnchDropHi(); });
  });
}
// Remove the drop highlight from every creature (dragend / after a drop).
function clearEnchDropHi(){ document.querySelectorAll('.thumb.enchdrop').forEach(t=>t.classList.remove('enchdrop')); }

function wireBoard() {
  // remove ✕ on planned cards in the field
  $('board').querySelectorAll('.thumb.planned .rm[data-rm]').forEach(x =>
    x.onclick = e => { e.stopPropagation(); removePlanAt(+x.dataset.rm); });
  // A planned Aura overlapping its host can be dragged onto ANOTHER creature to re-aim it (same
  // path as the plan-bar chip: stamp text/planidx, retargetPlanAura reassigns; never duplicates).
  $('board').querySelectorAll('.thumb.aura-plan[data-pi]').forEach(t=>{
    t.addEventListener('dragstart', e=>{ e.stopPropagation(); const i=+t.dataset.pi;
      e.dataTransfer.setData('text/planidx', String(i));
      S._dragCard=null; S._dragKind=null; S._dragTargets=enchantTargetsFor(S.plan[i].name); });
    t.addEventListener('dragend', ()=>{ S._dragCard=null; S._dragKind=null; S._dragTargets=null; clearEnchDropHi(); });
  });
  // click the Land's Edge permanent (the ability source) to enter/exit discard mode
  $('board').querySelectorAll('.thumb[data-le]').forEach(t =>
    t.onclick = e => { e.stopPropagation(); toggleLeMode(); });
  // click an Aether Vial to enter/exit deploy mode (then click a matching-MV creature in hand)
  $('board').querySelectorAll('.thumb[data-vial]').forEach(t =>
    t.onclick = e => { e.stopPropagation(); toggleVialMode(+t.dataset.vial); });
  // click a Retrace card in the graveyard to cast it from there (discards a land)
  $('board').querySelectorAll('.thumb[data-retrace]').forEach(t =>
    t.onclick = e => { e.stopPropagation(); retraceCard(t.dataset.name); });
  // click a land with a sacrifice-to-draw ability (Fiery Islet) to sacrifice it for a card
  $('board').querySelectorAll('.thumb[data-sacdig]').forEach(t =>
    t.onclick = e => { e.stopPropagation(); const nm=t.dataset.sacdig;
      fireDig(digSources().sac[nm], `sacrifice ${nm} to draw`); });
  // click a permanent with an activated ability (Krenko's token tap, a Goblin sac outlet) to queue
  // one activation into this phase's line; clicking past the cap removes the last one.
  $('board').querySelectorAll('.thumb[data-activate]').forEach(t =>
    t.onclick = e => { e.stopPropagation(); toggleActivate(t.dataset.activate); });
}

function renderEffects() {
  const el=$('effects'); if(!el) return;
  const eff=computeDiff(); el.innerHTML = eff ? eff.map(e=>`<span class="ef ${e.cls}" data-name="${esc(e.name||'')}">${esc(e.text)}</span>`).join('') : '';
}
function computeDiff() {
  const a=S.prev, b=S.decision;
  if (!a||!b||a.type!=='main_phase'||b.type!=='main_phase') return null;
  const out=[];
  const ms=(arr,key)=>{ const m={}; (arr||[]).forEach(x=>{const k=key?x[key]:x; m[k]=(m[k]||0)+1;}); return m; };
  const addedNames=(na,nb,key)=>{ const A=ms(na,key),B=ms(nb,key),r=[]; for(const k in B){const d=B[k]-(A[k]||0);for(let i=0;i<d;i++)r.push(k);} return r; };
  addedNames(a.me.battlefield,b.me.battlefield,'name').forEach(n=>out.push({cls:'add',text:'▲ '+n,name:n}));
  // Cards that ENTERED hand since the prior decision (a draw, or a tutor/Gamble fetch). Shown so
  // the result of a tutor is visible; the matching discard appears below as a graveyard add.
  addedNames(a.me.hand,b.me.hand,'name').forEach(n=>out.push({cls:'draw',text:'+ '+n+' to hand',name:n}));
  addedNames(a.me.graveyard,b.me.graveyard).forEach(n=>out.push({cls:'gy',text:'⤓ '+n+' → graveyard',name:n}));
  const drew=(a.me.library_size||0)-(b.me.library_size||0);
  if (drew>0) out.push({cls:'draw',text:drew+' off library'});
  const oppd=(a.opponent.life||0)-(b.opponent.life||0);
  if (oppd>0) out.push({cls:'opp',text:'opp −'+oppd+' life'});
  return out.length?out:null;
}

// Click the Land's Edge permanent (the ability SOURCE) to enter/exit activation mode.
// In the mode, clicking lands adds them to the discard; clicking Land's Edge again exits.
function toggleLeMode() {
  if (S.over || !S.decision || S.decision.type!=='main_phase' || !S.decision.lands_edge) return;
  hideVerdict();
  S.leMode = !S.leMode; if (S.leMode) S.vialMode=null;   // mutually exclusive click modes
  if (S.leMode) flashHint(`Land’s Edge active — click lands to discard them (${S.decision.lands_edge.rate} dmg each). Click Land’s Edge again to finish.`);
  renderBoard();
}

// Click an Aether Vial to enter deploy mode for its charge value; then click a hand creature
// whose mana value equals that charge to put it onto the battlefield for free (one per Vial).
function toggleVialMode(charge) {
  if (S.over || !S.decision || S.decision.type!=='main_phase') return;
  hideVerdict();
  S.vialMode = (S.vialMode===charge) ? null : charge;
  if (S.vialMode!=null) { S.leMode=false;   // mutually exclusive click modes
    flashHint(`Aether Vial active — click a creature with mana value ${charge} in hand to deploy it free. Click the Vial again to cancel.`); }
  renderBoard();
}

// Click a Retrace card in the graveyard to add a graveyard cast (the engine discards a land as
// the additional cost; you need a land in hand). Toggles off if already queued.
function retraceCard(name) {
  if (S.over || !S.decision || S.decision.type!=='main_phase') return;
  hideVerdict();
  const existing = S.plan.findIndex(p=>p.kind==='retrace' && p.name===name);
  if (existing >= 0) { S.plan.splice(existing,1); renderBoard(); return; }
  const hasLand = (S.decision.me.hand||[]).some(c=>c.kind==='land');
  if (!hasLand) { flashHint(`Retrace needs a land in hand to discard.`); return; }
  S.plan.push({name, kind:'retrace'});
  flashHint(`Retracing ${name} from the graveyard (a land will be discarded). Commit to resolve.`);
  renderBoard();
}

function activateAbility(name) {
  if (S.over || !S.decision || S.decision.type!=='main_phase') return;
  const le = S.decision.lands_edge;
  const card = (S.decision.me.hand||[]).find(c=>c.name===name);
  // Aether Vial deploy mode (entered by clicking a Vial): click a creature whose mana value
  // matches the Vial's charge to put it onto the battlefield for free (one creature per Vial).
  if (S.vialMode!=null) {
    if (card && card.is_creature && card.mv===S.vialMode) {
      hideVerdict(); S.plan.push({name, kind:'vial'}); S.vialMode=null;
      flashHint(`Deploying ${name} via Aether Vial (free). Commit to resolve.`); renderBoard(); return;
    }
    flashHint(`Aether Vial: click a creature with mana value ${S.vialMode} (or click the Vial again to cancel).`); return;
  }
  // Clicking a land only feeds Land's Edge while the mode is active (entered by clicking the
  // Land's Edge permanent). Each click discards one land; the engine fires lands generically,
  // so we only track the count, but we carry the clicked land's name so it shows in the zone.
  if (S.leMode && le) {
    if (!card || card.kind!=='land') { flashHint('Land’s Edge: only LANDS can be discarded.'); return; }
    hideVerdict();
    if (leCount() >= leMax()) {
      const why = leMax()===0 ? 'no lands free to discard' : `already lethal (${leMax()} max)`;
      flashHint(`Land’s Edge: ${why}.`); return;
    }
    S.plan.push({name, kind:'le'});
    const n=leCount(), dmg=n*(le.rate||0);
    flashHint(`Land’s Edge: discarding ${n} land${n>1?'s':''} → ${dmg} damage (opponent to ${(S.decision.opponent.life||0)-dmg}).`);
    renderBoard(); return;
  }
  // Cycling (a land in HAND, e.g. Lonely Sandbar / Forgotten Cave): single-click discards it to draw.
  const cycIdx = digSources().cyc[name];
  if (cycIdx != null) { return fireDig(cycIdx, `cycle ${name} to draw`); }
  flashHint(`“${name}”: double-click or drag to CAST/PLAY it.`+(le?' Click your Land’s Edge to discard lands to it.':''));
}

// ---- commit / validate -----------------------------------------------------
async function commitLine() {
  if (S.busy) return; S.busy=true;
  const btn=$('commit'); if(btn){btn.disabled=true; btn.textContent='Checking…';}
  const line=encodeLine();
  const res=await post('/api/validate', cfg({ line }));
  S.busy=false;
  if (res.kind==='validation') return handleVerdict(res, line);
  if (res.kind==='decision') { advanceTo(res.decision); return; }
  if (res.kind==='result') return showResult(res.result);
  showError(res.error||'validate failed', res.raw);
}
// Variant picker (tutor/Gamble target, Ponder keep, Soulfire count, X) — shown in the CENTRAL image
// dialog (#5/#12), a grid of the candidate cards (cards[0] = the distinguishing card, e.g. the tutor
// target). Replaces the old right-side #verdict 'choose' panel so NO decision lives in the side panel.
// A committed line can resolve several ways when it involves independent sub-decisions (which land
// a fetch gets, which enchantment a tutor gets, an X value, a Soulfire own-target count). The engine
// returns the full set of enumerated `variants`, each carrying a structured `subs` breakdown. Rather
// than dump the cross-product flat (confusing for e.g. fetch × tutor), ask ONE dimension at a time
// and FILTER the remaining variants after each pick. Because we only ever offer choices that survive
// in the remaining set, couplings are respected automatically: a fetch target that can't pay for a
// given tutor target was never enumerated together, so that combination is simply never offered.
function renderChooseDialog(v, line){
  const variants=(v.variants||[]).slice();
  // Fallback: a variant with no structured subs can't be decomposed (degenerate / older engine).
  if (!variants.length || variants.some(x=>!x.subs || !x.subs.length)) return renderChooseFlat(v, line);
  // The dimension walk itself lives in linebuild.js (shared + headlessly testable) -- see the note
  // there. index.html keeps only the rendering and the auto-resolve shortcuts.
  const subOf=(x,key)=>LB.subOf(x,key);
  const choiceOf=(x,key)=>LB.choiceOf(x,key);

  function stepChoose(remaining, picks){
    if (remaining.length===1){ hideDecPanel(); return applyAccepted(remaining[0].plan_index, remaining[0].label); }
    // First dimension (by priority) that still has more than one distinct choice is the one to ask.
    const nd = LB.nextDimension(remaining);
    let dim = nd ? nd.dim : null, choices = nd ? nd.choices : null;
    // No distinguishing dimension left (shouldn't happen — distinct variants differ in some sub) —
    // commit the first remaining plan defensively.
    if (!dim){ hideDecPanel(); return applyAccepted(remaining[0].plan_index, remaining[0].label); }
    // Crackle target-count / Soulfire own-target-count are NOT a separate dialog: the count is a
    // sub-decision the search enumerates as "+0", "+1", ... variants, but forcing the user to pick
    // between otherwise-identical card thumbnails ("+0 own" vs "+1 own") makes no sense. Auto-commit
    // the MIN-count variant (the affordability FLOOR the cast pays the discount for), then let the
    // apply-time BOARD target step own the choice: both Crackle and Soulfire emit a `target` decision
    // where every target (opponent face, creatures, your own creatures, self) is individually
    // pickable in [floor, max]. So the count falls out of the board selection for both.
    if (dim.kind==='crackle' || dim.kind==='soulfire'){
      const minChoice=choices.map(c=>c.choice).sort((a,b)=>(parseInt((a+'').replace('+',''))||0)-(parseInt((b+'').replace('+',''))||0))[0];
      const next=remaining.filter(x=>choiceOf(x,dim.key)===minChoice);
      return stepChoose(next, picks.concat([{key:dim.key, choice:minChoice}]));
    }
    // Drag-to-enchant: if the user dragged this Aura onto a specific creature, auto-resolve its enchant
    // target to that creature (skip the manual pick), mirroring the crackle/soulfire auto-commit above.
    // The dimension key is "<Aura> →"; strip the arrow to get the aura name.
    if (dim.kind==='enchant'){
      const aura = dim.key.replace(/\s*→\s*$/,'').trim();
      const pref = enchantPrefFor(aura);
      const hit  = pref && choices.find(c=>c.choice===pref);
      if (hit){ const next=remaining.filter(x=>choiceOf(x,dim.key)===hit.choice);
                return stepChoose(next, picks.concat([{key:dim.key, choice:hit.choice}])); }
    }
    renderDimPick(dim, choices, remaining, picks);
  }

  function renderDimPick(dim, choices, remaining, picks){
    const panel=$('decpanel'), back=$('decback');
    back.className='modal'; back.style.display='block'; panel.className='show modal';
    // DISAMBIGUATION (viewer issue #13). Two tutors in one line (Crop Rotation + Sylvan Scrying)
    // produce two consecutive grids of the SAME 12 land images; the only thing telling them apart
    // used to be a small "<card> →?" heading, so the second pick read as a repeat of the first and
    // the run was reported as "I only got to choose one land". Now the SOURCE card's art leads the
    // dialog, and a step counter says how many decisions this line still holds.
    const step = picks.length + 1, total = picks.length + LB.dimensionsRemaining(remaining);
    // dim.key is "<card> →" / "<land> fetches" / "<card> X" / "<card> own targets" -- the leading
    // card name is the source. Strip the trailing relation word to get the art to show.
    const srcName = dim.key.replace(/\s*(\u2192|fetches|X|own targets|extra targets|splice|face)\s*$/,'').trim();
    const crumbs = picks.length
      ? `<div class="chosen">${picks.map(p=>`<span class="crumb">${esc(p.key)} <b>${esc(p.choice)}</b></span>`).join('')}</div>`
      : '';
    let h=`<div class="dimhead">${srcName?cardMini(srcName,'dimsrc'):''}`+
          `<div class="dimtext"><h3>${esc(dim.key)}?</h3>`+
          `<div class="sub">${total>1?`Decision ${step} of ${total} for this line — `:''}`+
          `pick one of ${choices.length}.</div></div></div>`+crumbs+`<div class="tutgrid">`;
    choices.forEach((c,i)=>{
      // The badge only adds value when the choice differs from the card name shown below (X=2,
      // +2 own). For fetch/tutor the choice IS the card name, so the badge just duplicates the
      // <em> label and its nowrap pill overflows into neighbours -- skip it there.
      const showBadge = c.card && c.choice!==c.card;
      h+=`<span class="cardmini varpick" data-i="${i}"${c.card?` data-name="${esc(c.card)}"`:''} title="${esc(c.choice)}">`+
         (showBadge?`<span class="varbadge">${esc(c.choice)}</span>`:'')+
         (c.card?`<img loading="lazy" src="${scryImg(c.card,'small')}" onerror="this.style.opacity=.15"/>`:`<span style="display:block;height:96px"></span>`)+
         `<em>${esc(c.card||c.choice)}</em></span>`;
    });
    h+=`</div><div class="pbtns" style="margin-top:10px">`+
       (picks.length?`<button id="chooseback" class="ghost">Back</button>`:'')+
       `<span class="spacer"></span><button id="choosecancel" class="ghost">Cancel</button></div>`;
    panel.innerHTML=h;
    panel.querySelectorAll('.varpick').forEach(b=>b.onclick=()=>{
      const c=choices[+b.dataset.i];
      const next=remaining.filter(x=>choiceOf(x,dim.key)===c.choice);
      stepChoose(next, picks.concat([{key:dim.key, choice:c.choice}]));
    });
    if (picks.length) $('chooseback').onclick=()=>replay(picks.slice(0,-1));
    $('choosecancel').onclick=()=>{ hideDecPanel(); renderBoard(); };
  }

  // Back: re-filter from the full variant set with all-but-the-last pick, re-asking that dimension.
  function replay(picks){
    let remaining=variants.slice();
    picks.forEach(p=>{ remaining=remaining.filter(x=>choiceOf(x,p.key)===p.choice); });
    stepChoose(remaining, picks);
  }

  stepChoose(variants, []);
}
// Legacy flat picker (all variants in one grid) — retained as a fallback for variants that lack a
// structured `subs` breakdown, and for any degenerate case the sequential picker can't split.
function renderChooseFlat(v, line){
  const panel=$('decpanel'), back=$('decback');
  back.className='modal'; back.style.display='block'; panel.className='show modal';
  let h=`<h3>Choose how to resolve</h3>`+
    `<div class="sub">This line resolves several ways — pick one (the AI chooses among these too).</div>`+
    `<div class="tutgrid">`;
  (v.variants||[]).forEach(x=>{
    const card=(x.cards||[])[0]||'';
    // The distinguishing detail (e.g. "X=2", "→ Target") is the part of the label past the card name.
    // Show it as a prominent badge so otherwise-identical card images (Crackle X=1 vs X=2) are tellable.
    let detail = x.label||'';
    if (card && detail.indexOf(card)===0) detail = detail.slice(card.length).replace(/^[\s:·-]+/,'');
    h+=`<span class="cardmini varpick" data-pi="${x.plan_index}" data-lab="${esc(x.label)}"${card?` data-name="${esc(card)}"`:''} title="${esc(x.label)}">`+
       (detail?`<span class="varbadge">${esc(detail)}</span>`:'')+
       (card?`<img loading="lazy" src="${scryImg(card,'small')}" onerror="this.style.opacity=.15"/>`:`<span style="display:block;height:96px"></span>`)+
       `<em>${esc(card||x.label)}</em></span>`;
  });
  h+=`</div><div class="pbtns" style="margin-top:10px"><span class="spacer"></span><button id="choosecancel" class="ghost">Cancel</button></div>`;
  panel.innerHTML=h;
  panel.querySelectorAll('.varpick').forEach(b=>b.onclick=()=>{ hideDecPanel(); applyAccepted(+b.dataset.pi, b.dataset.lab); });
  $('choosecancel').onclick=()=>{ hideDecPanel(); renderBoard(); };
}
function applyAccepted(planIndex, label) {
  S.history.push({ turn:S.decision.turn, label });
  // Remember which cards this line CAST, so the graveyard-add log can exclude them and surface only
  // the involuntary adds (Gamble's random discard, a mill, etc.) — #1: name the discarded card.
  S.lastCasts = new Set((S.plan||[]).filter(p=>p.kind!=='land'&&p.kind!=='le').map(p=>p.name));
  // Dropped-cast detection is now SERVER-TRUTH (issue #3a): the engine reports decision.dropped_casts,
  // so step() no longer needs pre-commit hand/gy/battlefield snapshots to infer a silent drop. (The old
  // board-diff detectDropped false-positived on self-sacrificing/redrawn casts.)
  // Record a step so undo can pop this main-phase decision. Without it S.steps desyncs from
  // S.choices and undo() (which bails when S.steps is empty) silently does nothing after any line.
  // {n, auto}: n = ints this decision contributed; auto = it was committed WITHOUT a user rest
  // (dead-opponent / commit-turn auto-pass / auto-resolve), so undo rolls it back together with the
  // preceding user step rather than landing mid-auto-sequence (issue #2).
  // #10 cast-order: if the human queued the accepted plan's non-sac casts in a NON-canonical order, pin
  // that order via the main-ordinal-keyed side-channel (S.castOrder). The engine emits each plan's
  // cast_order_canonical (>=2 casts) + the decision's main_ordinal; we send --cast-order ONLY when the
  // human's queued sequence differs from canonical (same multiset, different order) -> references that
  // aren't reordered stay byte-identical. Keyed step marker `co` so undo drops the side-channel entry.
  let coKey = null;
  const dec0 = S.decision, plan0 = dec0 && dec0.plans && dec0.plans[planIndex];
  const canon = plan0 && plan0.cast_order_canonical;
  if (canon && canon.length >= 2 && dec0.main_ordinal != null) {
    const human = (S.plan||[]).map(p=>p.name).filter(n => canon.includes(n));
    const ms = a => a.slice().sort().join('');
    if (ms(human) === ms(canon) && human.some((n,i)=>n!==canon[i])) {   // same casts, different order
      coKey = String(dec0.main_ordinal);
      (S.castOrder=S.castOrder||{})[coKey] = human;
    }
  }
  S.prev = S.decision; S.choices.push(planIndex);
  (S.steps=S.steps||[]).push({ n:1, auto:!!(S.decision && S.decision._autoStep), co:coKey });
  S.plan=[]; S.leMode=false; S.vialMode=null;
  renderHistory(); hideVerdict(); step();
}
function handleVerdict(v, line) {
  if (v.verdict==='accept') return applyAccepted(v.plan_index, v.matched_summary || line);
  if (v.verdict==='choose') return renderChooseDialog(v, line);   // central image dialog, not the side panel
  // REJECT (illegal / legal_not_enumerated / unsupported): the committed line did NOT play, so a
  // pending "Pass turn" skip (S.commitTurn, set by the Commit-turn button) must be dropped -- otherwise
  // picking an ALTERNATE plan from the menu below inherits the skip and auto-passes the rest of THIS
  // turn (advanceTo), so the user never gets the same turn's post_main decision to cast e.g. Apex of
  // Power. A reject means "your intended turn didn't happen" -> hand control back; the user re-declares
  // Pass phase / Pass turn on the next decision. (Commit-phase never sets the flag, so it's unaffected.)
  S.commitTurn = null; S.commitTurnPasses = 0;
  const cls=v.verdict==='legal_not_enumerated'?'legal':(v.verdict==='unsupported'?'unsupported':'illegal');
  const tag=v.verdict==='legal_not_enumerated'?'legal · not enumerated':(v.verdict==='unsupported'?'unsupported':'illegal');
  const head=v.verdict==='legal_not_enumerated'?'Rules-legal, but the model never enumerated it.'
            :v.verdict==='unsupported'?'The v1 line check can’t validate this yet.':'The model can’t play this line.';
  const plans=(v.decision&&v.decision.plans)||[];
  // Each enumerated plan is CLICKABLE: picking it submits that plan index directly (same path a normal
  // plan selection takes), so when the line-check can't validate a hand-built line (an X-spell like
  // Crackle with Power, a bounce-land-after-casts sequence, issue #7) the user can one-click the
  // matching combined plan the model DOES offer -- e.g. "land=Izzet Boilerworks; cast Crackle, Irencrag
  // Feat" -- instead of rebuilding it. Plans with a valid index are buttons; the "(only pass)" fallback
  // is inert text.
  const mp=plans.length
    ? plans.map(p=>`<button class="variant vplan" data-plan="${p.index}">${esc(p.summary)}</button>`).join('')
    : '<div>• (only pass)</div>';
  const ve=$('verdict'); ve.className=cls;
  ve.innerHTML=`<span class="vtag">${tag}</span><h4>${head}</h4>`+
    `<div>${esc(v.reason||'')}${v.failed_action?`<br><span class="hint">at: ${esc(v.failed_action)}</span>`:''}</div>`+
    `<div class="modelplans"><b>What the model would accept${plans.length?' (click to play)':''}:</b>${mp}</div>`+
    `<div class="actions"><button id="artbtn" class="primary">Store as artifact</button>`+
    `<button id="retrybtn" class="ghost">Clear &amp; retry</button></div><div id="artinfo" class="hint" style="margin-top:8px"></div>`;
  ve.style.display='block';
  $('retrybtn').onclick=clearPlan; $('artbtn').onclick=()=>storeArtifact(v, line);
  // Wire each model-plan button to submit its index. Clear S.plan first so the rejected hand-built
  // queue doesn't seed a false dropped-cast check against the (different) model plan's actual casts.
  ve.querySelectorAll('.vplan').forEach(btn=>btn.onclick=()=>{
    const idx=parseInt(btn.getAttribute('data-plan'),10);
    if (!Number.isFinite(idx)) return;
    S.plan=[]; S.leMode=false; S.vialMode=null;
    applyAccepted(idx, 'chose model plan: '+btn.textContent);
  });
}
async function storeArtifact(v, line) {
  S.hadReject=true; $('artinfo').textContent='saving…';
  const d=S.decision;
  const res=await post('/api/reject-artifact', cfg({ line, turn:d.turn, phase:d.phase,
    attemptedLine:{ plan:S.plan.slice() }, verdict:v.verdict, reason:v.reason, failed_action:v.failed_action,
    modelPlans:(v.decision&&v.decision.plans)||[], state:{me:d.me, opponent:d.opponent} }));
  $('artinfo').innerHTML = res.savedAs?`Stored: <b>${esc(res.savedAs)}</b>`:`<span class="err">save failed: ${esc(res.error||'unknown')}</span>`;
  S.history.push({ turn:d.turn, label:`tried (${v.verdict}): ${line}`, rej:true }); renderHistory();
}

// ---- central decision panel (scry/surveil/reorder/target/vial/bounce) ------------------------
// Every non-main decision overlays a central panel while the board+hand stay rendered behind it,
// so a decision never blanks the board. Look-at-top decisions are a centered modal (no board
// interaction); target/bounce/vial are a bottom prompt with the board left fully clickable so you
// pick targets/lands IN PLACE (highlighted on the real board), the AI's heuristic pick preselected.

// ---- selection model (target / bounce: in-place board selection) ----
function tgtKey(t){ return (t.kind==='player'?'p:':'m:')+t.index; }
// The legal opponent/your face target for a target decision (matched by label), or null.
function faceTarget(d, who){
  if (!d || (d.type!=='target' && d.type!=='divide')) return null;
  const re = who==='opp' ? /opponent/i : /\byou(r)?\b/i;
  return (d.legal_targets||[]).find(t=>t.kind==='player' && re.test(t.label)) || null;
}
function isSelT(t){ return !!(S.boardSel && t && S.boardSel.has(tgtKey(t))); }
// Seed the board selection from the AI's heuristic-default option (so targeting/bounce start on
// the smart pick, which the player can then retarget by clicking the board).
function initBoardSel(d){
  S.boardSel = new Set();
  if (d.type==='target'){
    const def=(d.options||[]).find(o=>o.index===d.heuristic_default)||{targets:[]};
    (def.targets||[]).forEach(t=>S.boardSel.add(tgtKey(t)));
  } else if (d.type==='bounce' || d.type==='sacrifice'){
    const def=(d.options||[]).find(o=>o.index===d.heuristic_default)||(d.options||[])[0];
    if (def) S.boardSel.add('m:'+def.perm_index);
  }
  S._selFor = d.decision_index;
}
function legalTargetKeys(d){
  if (d.type==='target') return new Set((d.legal_targets||[]).map(tgtKey));
  if (d.type==='bounce' || d.type==='sacrifice') return new Set((d.options||[]).map(o=>'m:'+o.perm_index));
  return new Set();
}
function toggleSel(d, key, max){
  if (!S.boardSel) S.boardSel=new Set();
  if (S.boardSel.has(key)) S.boardSel.delete(key);
  else { if (max===1) S.boardSel.clear(); if (S.boardSel.size<max) S.boardSel.add(key); }
  renderBoard();   // re-render -> updates board highlight + panel count
}
// Add highlight classes + click handlers to the real board for an active target/bounce/vial decision.
function wireDecisionBoard(d, dec){
  const board=$('board');
  if (dec==='target' || dec==='bounce' || dec==='sacrifice' || dec==='soulfire_targets'){
    const legal=legalTargetKeys(d);
    const max = (dec==='bounce'||dec==='sacrifice')?1:(dec==='soulfire_targets'?(d.count||1):(d.max_targets||1));
    board.querySelectorAll('.thumb[data-idx]').forEach(t=>{
      const key='m:'+t.dataset.idx; if (!legal.has(key)) return;
      t.classList.add('selectable'); if (S.boardSel && S.boardSel.has(key)) t.classList.add('selected');
      t.onclick=e=>{ e.stopPropagation(); toggleSel(d, key, max); };
    });
    board.querySelectorAll('.life b[data-tk]').forEach(b=>{ b.onclick=()=>toggleSel(d, b.dataset.tk, max); });
  } else if (dec==='vial_charge' && d.perm_index!=null && d.perm_index>=0){
    const t=board.querySelector(`.thumb[data-idx="${d.perm_index}"]`); if (t) t.classList.add('selectable');
  } else if (dec==='divide'){
    wireDivideBoard(d);
  }
}

// ---- divided-damage board editor (Fiery Justice / Magma Opus): an editable number on each legal
// target, ANY number of targets each >= 1 summing to total. The answer is one int per legal target
// (in legal order), matching the engine's per-target read -- no target-count cap.
function divKey(t){ return (t.kind==='player'?'p:':'m:')+t.index; }
function initDivAlloc(d){
  S.divAlloc={};
  (d.legal_targets||[]).forEach(t=>{ S.divAlloc[divKey(t)] = t.default||0; });
  S._divFor=d.decision_index;
}
function divTotalAssigned(){ let s=0; for(const k in (S.divAlloc||{})) s+=+S.divAlloc[k]||0; return s; }
function divTargetCount(){ let n=0; for(const k in (S.divAlloc||{})) if((+S.divAlloc[k]||0)>0) n++; return n; }
// Set one target's amount, clamped so the running sum never exceeds total; refresh the input + prompt
// in place (no board re-render, so a typed input keeps focus).
function setDivAmt(d, key, v){
  const total=d.total_damage||0;
  let others=0; for(const k in S.divAlloc){ if(k!==key) others+=+S.divAlloc[k]||0; }
  v=Math.max(0, Math.min(total-others, Math.floor(+v||0)));
  S.divAlloc[key]=v;
  const inp=document.querySelector(`.divw[data-k="${key}"] input`); if(inp && +inp.value!==v) inp.value=v;
  divSetTargeted(key, v>0);
  updateDivPrompt(d);
}
function updateDivPrompt(d){
  const sum=divTotalAssigned(), total=d.total_damage||0, n=divTargetCount();
  const c=document.querySelector('#decpanel .pcount');
  if(c) c.textContent=`${sum} / ${total} assigned · ${n} target${n===1?'':'s'}`;
  const btn=document.querySelector('#decpanel #decconfirm'); if(btn) btn.disabled=!(sum===total && n>=1);
}
// The host element (creature thumb or face life <b>) a divide widget is attached to.
function divHostFor(key){
  const w=document.querySelector(`.divw[data-k="${key}"]`); if(!w) return null;
  return w.classList.contains('face') ? w.previousElementSibling : w.closest('.thumb');
}
// Colour a divide target RED (targeted) when it has damage assigned, BLUE otherwise -- matching
// the rest of the targeting UI so an assigned target reads the same as a selected one.
function divSetTargeted(key, on){ const h=divHostFor(key); if(h) h.classList.toggle('divon', !!on); }
function wireDivideBoard(d){
  const board=$('board');
  (d.legal_targets||[]).forEach(t=>{
    const key=divKey(t);
    const host = t.kind==='player'
      ? board.querySelector(`.life b[data-tk="p:${t.index}"]`)
      : board.querySelector(`.thumb[data-idx="${t.index}"]`);
    if (!host) return;
    const cur=(S.divAlloc&&S.divAlloc[key])||0;
    const w=document.createElement('span');
    w.className='divw'+(t.kind==='player'?' face':'');
    w.setAttribute('data-k', key);
    w.innerHTML=`<button class="dm" tabindex="-1">−</button>`+
      `<input type="number" min="0" max="${d.total_damage}" value="${cur}"/>`+
      `<button class="dp" tabindex="-1">+</button>`;
    const inp=w.querySelector('input');
    inp.oninput=()=>setDivAmt(d,key,inp.value);
    w.querySelector('.dm').onclick=(e)=>{ e.stopPropagation(); setDivAmt(d,key,(S.divAlloc[key]||0)-1); };
    w.querySelector('.dp').onclick=(e)=>{ e.stopPropagation(); setDivAmt(d,key,(S.divAlloc[key]||0)+1); };
    if (t.kind==='player') host.insertAdjacentElement('afterend', w);
    else { host.classList.add('divtgt'); host.appendChild(w); }
    host.classList.toggle('divon', cur>0);   // initial: red iff this target already has damage
  });
}

function renderDecisionPanel(d, dec){
  const panel=$('decpanel'), back=$('decback');
  const isLook = dec==='scry'||dec==='surveil'||dec==='reorder';
  const isModal = isLook || dec==='dig' || dec==='discard' || dec==='expressive_iteration' || dec==='retrace_discard'
                || dec==='replicate' || dec==='mulligan' || dec==='bottom' || dec==='land_entry' || dec==='dragon' || dec==='sac_tutor'
                || dec==='lightpaws' || dec==='firebreathe' || dec==='storage_hold'
                || dec==='lackey_put' || dec==='echo' || dec==='tutor_etb'; // centered card-image modals
  back.className = isModal ? 'modal' : '';                // dim+block only for modal decisions
  back.style.display = isModal ? 'block' : 'none';
  panel.className = 'show ' + (isModal?'modal':'prompt');
  panel.innerHTML = isLook ? lookPanelHtml(d, dec) : dec==='dig' ? digPanelHtml(d)
                  : dec==='discard' ? discardPanelHtml(d)
                  : dec==='expressive_iteration' ? eiPanelHtml(d)
                  : dec==='retrace_discard' ? retraceDiscardPanelHtml(d)
                  : dec==='replicate' ? replicatePanelHtml(d)
                  : dec==='land_entry' ? landEntryPanelHtml(d)
                  : dec==='mulligan' ? mulliganPanelHtml(d)
                  : dec==='bottom' ? bottomPanelHtml(d)
                  : dec==='dragon' ? dragonPanelHtml(d)
                  : dec==='sac_tutor' ? sacTutorPanelHtml(d)
                  : dec==='lackey_put' ? lackeyPanelHtml(d)
                  : dec==='tutor_etb' ? tutorPanelHtml(d)
                  : dec==='echo' ? echoPanelHtml(d)
                  : dec==='lightpaws' ? lightPawsPanelHtml(d)
                  : dec==='firebreathe' ? firebreathePanelHtml(d)
                  : dec==='storage_hold' ? storageHoldPanelHtml(d)
                  : promptPanelHtml(d, dec);   // divide + target/bounce/vial are bottom board prompts
  wireDecisionPanel(d, dec);
  // Pre-game keep/bottom decisions consult the deck's MULLIGAN TABLE, but its parse is expensive, so it
  // is fetched ASYNCHRONOUSLY (fetchKeepHint) in parallel with the modal -- the human decides without
  // waiting (the AI pick is good-to-have, not required). One shot per decision, guarded so the repaint-
  // on-arrival doesn't loop. fetchKeepHint falls back to the deep-search hint for a table-less deck.
  if ((dec==='mulligan' || dec==='bottom') && !(d.ai_set&&d.ai_set.length)
      && d._keepHint===undefined && !d._keepHintPending) fetchKeepHint(d);
}

function lightPawsPanelHtml(d){

  const legal=[], seenLegal=new Set(), illegal=[], seenAll=new Set();

// Bottom panel: IMAGE-based central modal (mirrors the cleanup-discard panel), shown once per card to
// bottom after a London keep. Click a card to put it on the bottom. The AI's pick is the DEEP-search
// (depth HINT) pick, fetched ASYNCHRONOUSLY (fetchBottomHint) so the modal appears instantly and never
// waits on the clairvoyant bottoming rollout: it shows "AI thinking…" until the hint lands, then tags
// the AI's pick and ✓-marks the removals that preserve the earliest win. The shallow depth-0 pick from
// the primary step is deliberately ignored (we want the deep pick, not the greedy one).
function bottomPanelHtml(d){
  const hand=d.hand||[];
  const K=d.bottom_total||1;                    // total cards to bottom this keep (London mulligan_count)
  // Tabled deck: the exhaustive mulligan profile gives the JOINT optimal bottom set (all K at once, a
  // lookup -- not a card-at-a-time search), emitted as ai_set. Pre-select it. Table-less deck: fall back
  // to the async per-step deep hint (top pick + win-optimal safe flags).
  const tabled = Array.isArray(d.ai_set) && d.ai_set.length===K;   // only when it covers ALL K bottoms
  const aiSet = tabled ? new Set(d.ai_set) : null;
  const hint=d._aiHint;
  const ai = (!tabled && hint && hint.ai_choice) ? hint.ai_choice.index : undefined;
  const wo = (!tabled && hint && hint.win_optimal) ? hint.win_optimal : [];
  const someOpt = wo.length && wo.some(x=>x===true) && wo.some(x=>x===false);
  // Init selection once per decision so re-renders on toggle keep the picks; seed with the profile's
  // joint set when tabled. The engine reads one hand-index per bottom decision, so commitBottomBatch
  // submits the picks in DESCENDING hand-index order (identical technique to the cleanup-discard panel).
  if (S._bottomFor !== d.decision_index){ S._bottomFor=d.decision_index; S.bottomSel=new Set(tabled?d.ai_set:[]); }
  const sel=S.bottomSel;
  const hintTxt = tabled ? `Mulligan profile’s optimal set is preselected`
                : d._keepHintPending ? `<span class="hint">consulting mulligan table…</span>`
                : hint===undefined ? `<span class="hint">AI thinking…</span>`
                : (ai!=null && hand[ai]) ? `AI would start with <b>${esc(hand[ai].name)}</b> (depth ${hint.depth})`
                : `AI pick unavailable`;
